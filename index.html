<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALEN WORLD</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f4f4f0;
  color: #111;
  font-family: Arial, Helvetica, sans-serif;
}

#app,
#map {
  width: 100%;
  height: 100%;
}

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  filter: grayscale(1) contrast(.9);
}

/* HEADER */

.header {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 1000;
  pointer-events: none;
}

.logo {
  display: inline-block;
  padding: 4px 7px 3px;
  border: 2px solid #111;
  background: #f4f4f0;
  font-size: 25px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -1.8px;
}

.subtitle {
  display: inline-block;
  margin-top: 5px;
  padding: 4px 6px;
  border: 1px dashed #111;
  background: #f4f4f0;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
}

/* FILTERS */

.controls {
  position: absolute;
  top: 88px;
  left: 16px;
  right: 16px;
  z-index: 1000;
  display: flex;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
}

.controls::-webkit-scrollbar {
  display: none;
}

.filter {
  flex-shrink: 0;
  padding: 7px 10px;
  border: 1px solid #111;
  border-radius: 0;
  background: #f4f4f0;
  color: #111;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
}

.filter.active {
  background: #111;
  color: #f4f4f0;
}

/* STATS */

.stats {
  position: absolute;
  left: 16px;
  bottom: 85px;
  z-index: 1000;
  padding: 5px 7px;
  border: 1px dashed #111;
  background: rgba(244,244,240,.9);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1px;
}

/* ADD */

.add-button {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 18px;
  z-index: 1000;
  padding: 14px;
  border: 2px solid #111;
  border-radius: 0;
  background: #f4f4f0;
  color: #111;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1.2px;
}

.add-button:active {
  background: #111;
  color: #f4f4f0;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 3000;
  padding: 15px;
  background: rgba(0,0,0,.65);
  align-items: center;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.panel {
  width: 100%;
  max-width: 500px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 17px;
  background: #f4f4f0;
  color: #111;
  border: 2px solid #111;
}

.panel h2 {
  margin: 0 0 18px;
  font-size: 24px;
  line-height: 1;
  letter-spacing: -1px;
}

.close {
  float: right;
  width: 30px;
  height: 30px;
  border: 1px solid #111;
  background: transparent;
  font-size: 18px;
  font-weight: 900;
}

/* FORM */

label {
  display: block;
  margin-top: 14px;
  margin-bottom: 5px;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1.2px;
}

input,
select {
  width: 100%;
  padding: 10px;
  border: 1px solid #111;
  border-radius: 0;
  background: transparent;
  color: #111;
  font-size: 14px;
}

input[type="file"] {
  padding: 9px;
}

.location-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 7px;
}

.location-button {
  padding: 11px 7px;
  border: 1px solid #111;
  background: transparent;
  color: #111;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .7px;
}

.location-button.active {
  background: #111;
  color: #f4f4f0;
}

.location-info {
  margin-top: 7px;
  padding: 7px;
  border: 1px dashed #111;
  font-size: 9px;
  font-weight: 700;
  line-height: 1.4;
}

.submit {
  width: 100%;
  margin-top: 15px;
  padding: 13px;
  border: 2px solid #111;
  background: #111;
  color: #f4f4f0;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
}

#statusMessage {
  margin-top: 10px;
  font-size: 10px;
  font-weight: 900;
  line-height: 1.4;
}

/* POPUP */

.archive-popup {
  min-width: 170px;
}

.archive-popup strong {
  font-size: 13px;
}

.archive-popup img {
  width: 100%;
  max-height: 150px;
  object-fit: cover;
  margin-top: 8px;
  filter: grayscale(1);
}

.archive-popup .meta {
  margin-top: 5px;
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  border-radius: 0;
  box-shadow: none;
}

.leaflet-control-zoom a {
  border-radius: 0 !important;
}

/* PLACEMENT */

#map-placement-message {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2500;
  padding: 10px 12px;
  border: 2px solid #111;
  background: #f4f4f0;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
  text-align: center;
}

@media (min-width: 700px) {
  .add-button {
    left: auto;
    right: 20px;
    width: 230px;
  }

  .stats {
    left: auto;
    right: 20px;
  }

  .controls {
    right: auto;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="map"></div>

  <div id="map-placement-message">
    TOUCHEZ LA CARTE POUR PLACER L'ŒUVRE
  </div>

  <header class="header">
    <div class="logo">VALEN WORLD</div>
    <br>
    <div class="subtitle">
      STREET ART / PUBLIC ARCHIVE
    </div>
  </header>

  <div class="controls">

    <button class="filter active" data-filter="all">
      ALL
    </button>

    <button class="filter" data-filter="sticker">
      STICKER
    </button>

    <button class="filter" data-filter="tag">
      TAG
    </button>

    <button class="filter" data-filter="graff">
      GRAFF
    </button>

  </div>

  <div class="stats">
    <span id="counter">0</span>
    &nbsp;WORKS
  </div>

  <button class="add-button" id="openModal">
    ＋ AJOUTER UNE ŒUVRE
  </button>

</div>


<!-- FORMULAIRE -->

<div class="modal" id="modal">

  <div class="panel">

    <button class="close" id="closeModal">
      ×
    </button>

    <h2>
      AJOUTER UNE ŒUVRE
    </h2>

    <form id="workForm">

      <label>
        CATÉGORIE *
      </label>

      <select id="category" required>

        <option value="">
          Sélectionner
        </option>

        <option value="sticker">
          STICKER
        </option>

        <option value="tag">
          TAG
        </option>

        <option value="graff">
          GRAFF
        </option>

      </select>


      <label>
        PHOTO *
      </label>

      <input
        type="file"
        id="photo"
        accept="image/*"
        required
      >

      <div
        id="photoInfo"
        class="location-info"
        style="display:none;"
      ></div>


      <label>
        LOCALISATION
      </label>

      <input
        type="text"
        id="address"
        placeholder="Entrer une adresse"
      >

      <div class="location-buttons">

        <button
          type="button"
          class="location-button"
          id="addressButton"
        >
          UTILISER L'ADRESSE
        </button>

        <button
          type="button"
          class="location-button"
          id="gpsButton"
        >
          MA POSITION
        </button>

      </div>

      <button
        type="button"
        class="location-button"
        id="mapButton"
        style="width:100%;margin-top:6px;"
      >
        PLACER SUR LA CARTE
      </button>

      <div
        class="location-info"
        id="locationInfo"
      >
        AUCUNE LOCALISATION SÉLECTIONNÉE
      </div>


      <label>
        DATE DE L'ŒUVRE
      </label>

      <input
        type="date"
        id="date"
        required
      >

      <div
        class="location-info"
        id="dateInfo"
      >
        DATE DU JOUR PAR DÉFAUT
      </div>


      <button
        type="submit"
        class="submit"
      >
        ENVOYER POUR VALIDATION
      </button>

      <div id="statusMessage"></div>

    </form>

  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Lecture EXIF : date + GPS -->
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://klvcugwhjaxmpvskplqd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AAzooie5TH6HNzupodCrvQ_nWrY0D_t";


/* =====================================================
   MAP
===================================================== */

const map =
  L.map("map", {
    zoomControl: false
  }).setView(
    [48.8566, 2.3522],
    5
  );


L.control.zoom({
  position: "bottomright"
}).addTo(map);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
      "© OpenStreetMap contributors"
  }
).addTo(map);


/* =====================================================
   VARIABLES
===================================================== */

let works = [];

let markers = [];

let currentFilter = "all";

let selectedLatitude = null;

let selectedLongitude = null;

let temporaryMarker = null;

let placementMode = false;


/* =====================================================
   DATE DU JOUR
===================================================== */

function getToday() {

  const d = new Date();

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(d.getDate()).padStart(2, "0")
  );

}

document.getElementById("date").value =
  getToday();


/* =====================================================
   PHOTO → EXIF
===================================================== */

document.getElementById("photo").addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if (!file) return;

    const info =
      document.getElementById("photoInfo");

    info.style.display = "block";

    info.textContent =
      "LECTURE DES MÉTADONNÉES DE LA PHOTO...";


    try {

      const exif =
        await exifr.parse(
          file,
          {
            gps: true,
            DateTimeOriginal: true,
            CreateDate: true
          }
        );


      let messages = [];


      /* DATE */

      const exifDate =
        exif?.DateTimeOriginal ||
        exif?.CreateDate;


      if (exifDate instanceof Date) {

        const yyyy =
          exifDate.getFullYear();

        const mm =
          String(
            exifDate.getMonth() + 1
          ).padStart(2, "0");

        const dd =
          String(
            exifDate.getDate()
          ).padStart(2, "0");


        document.getElementById("date").value =
          `${yyyy}-${mm}-${dd}`;

        messages.push(
          `DATE EXIF : ${dd}/${mm}/${yyyy}`
        );

      }


      /* GPS */

      if (
        typeof exif?.latitude === "number" &&
        typeof exif?.longitude === "number"
      ) {

        setLocation(
          exif.latitude,
          exif.longitude,
          "POSITION GPS RÉCUPÉRÉE DEPUIS LA PHOTO"
        );


        map.setView(
          [
            exif.latitude,
            exif.longitude
          ],
          17
        );


        messages.push(
          "GPS EXIF : POSITION RÉCUPÉRÉE"
        );

      }


      if (!messages.length) {

        messages.push(
          "AUCUNE DONNÉE EXIF — UTILISATION DES OPTIONS MANUELLES"
        );

      }


      info.textContent =
        messages.join(" • ");


    } catch (error) {

      console.error(
        "EXIF:",
        error
      );

      info.textContent =
        "MÉTADONNÉES NON DISPONIBLES — DATE DU JOUR UTILISÉE";

    }

  }
);


/* =====================================================
   MARKERS
===================================================== */

const markerStyles = {

  sticker: {
    radius: 7,
    dashArray: null
  },

  tag: {
    radius: 6,
    dashArray: "2,4"
  },

  graff: {
    radius: 10,
    dashArray: null
  }

};


function createMarker(work) {

  const style =
    markerStyles[
      work.category
    ] ||
    markerStyles.sticker;


  const marker =
    L.circleMarker(
      [
        Number(work.latitude),
        Number(work.longitude)
      ],
      {

        radius:
          style.radius,

        color:
          "#111",

        weight:
          2,

        dashArray:
          style.dashArray,

        fillColor:
          "#f4f4f0",

        fillOpacity:
          1

      }
    );


  let html = `
    <div class="archive-popup">

      <strong>
        ${escapeHTML(
          (work.category || "WORK").toUpperCase()
        )}
        #${work.Id}
      </strong>
  `;


  if (work.photo_url) {

    html += `
      <img
        src="${escapeHTML(work.photo_url)}"
        alt=""
      >
    `;

  }


  if (work.date) {

    html += `
      <div class="meta">
        ${escapeHTML(work.date)}
      </div>
    `;

  }


  html += `
    </div>
  `;


  marker.bindPopup(html);

  return marker;

}


function renderMarkers() {

  markers.forEach(
    marker =>
      map.removeLayer(marker)
  );

  markers = [];


  const filtered =
    currentFilter === "all"
      ? works
      : works.filter(
          work =>
            work.category === currentFilter
        );


  filtered.forEach(work => {

    const marker =
      createMarker(work);

    marker.addTo(map);

    markers.push(marker);

  });


  document.getElementById("counter").textContent =
    filtered.length;

}


/* =====================================================
   LOAD APPROVED WORKS
===================================================== */

async function loadWorks() {

  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/works?select=*&status=eq.approved&order=created_at.desc`,
        {
          headers: {
            "apikey":
              SUPABASE_KEY
          }
        }
      );


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(error);

    }


    works =
      await response.json();


    renderMarkers();


  } catch (error) {

    console.error(
      "LOAD WORKS:",
      error
    );

  }

}


loadWorks();


/* =====================================================
   FILTERS
===================================================== */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".filter")
          .forEach(
            b =>
              b.classList.remove("active")
          );


        button.classList.add("active");

        currentFilter =
          button.dataset.filter;

        renderMarkers();

      }
    );

  });


/* =====================================================
   MODAL
===================================================== */

const modal =
  document.getElementById("modal");


document.getElementById(
  "openModal"
).onclick = () => {

  modal.classList.add("show");

};


document.getElementById(
  "closeModal"
).onclick = () => {

  modal.classList.remove("show");

};


/* =====================================================
   LOCATION
===================================================== */

function setLocation(
  latitude,
  longitude,
  label
) {

  selectedLatitude =
    Number(latitude);

  selectedLongitude =
    Number(longitude);


  document.getElementById(
    "locationInfo"
  ).textContent =
    `${label} — ${selectedLatitude.toFixed(6)}, ${selectedLongitude.toFixed(6)}`;


  if (temporaryMarker) {

    map.removeLayer(
      temporaryMarker
    );

  }


  temporaryMarker =
    L.circleMarker(
      [
        selectedLatitude,
        selectedLongitude
      ],
      {

        radius: 8,

        color: "#111",

        weight: 2,

        dashArray: "3,3",

        fillColor: "#f4f4f0",

        fillOpacity: 1

      }
    ).addTo(map);

}


/* =====================================================
   ADDRESS
===================================================== */

document.getElementById(
  "addressButton"
).onclick =
  async () => {

    const address =
      document.getElementById(
        "address"
      ).value.trim();


    if (!address) {

      alert(
        "Entre une adresse."
      );

      return;

    }


    const button =
      document.getElementById(
        "addressButton"
      );


    button.textContent =
      "RECHERCHE...";


    try {

      const response =
        await fetch(
          "https://nominatim.openstreetmap.org/search?" +
          new URLSearchParams({
            q: address,
            format: "json",
            limit: "1"
          }),
          {
            headers: {
              "Accept-Language": "fr"
            }
          }
        );


      const results =
        await response.json();


      if (!results.length) {

        throw new Error(
          "Adresse introuvable."
        );

      }


      const result =
        results[0];


      setLocation(
        Number(result.lat),
        Number(result.lon),
        "ADRESSE : " + result.display_name
      );


      map.setView(
        [
          Number(result.lat),
          Number(result.lon)
        ],
        17
      );


    } catch (error) {

      alert(
        error.message
      );

    }


    button.textContent =
      "UTILISER L'ADRESSE";

  };


/* =====================================================
   GPS
===================================================== */

document.getElementById(
  "gpsButton"
).onclick =
  () => {

    if (!navigator.geolocation) {

      alert(
        "Géolocalisation indisponible."
      );

      return;

    }


    navigator.geolocation.getCurrentPosition(
      position => {

        setLocation(
          position.coords.latitude,
          position.coords.longitude,
          "POSITION ACTUELLE"
        );


        map.setView(
          [
            position.coords.latitude,
            position.coords.longitude
          ],
          17
        );

      },
      () => {

        alert(
          "Impossible d'obtenir votre position."
        );

      },
      {
        enableHighAccuracy: true,
        timeout: 10000
      }
    );

  };


/* =====================================================
   PLACER SUR CARTE
===================================================== */

document.getElementById(
  "mapButton"
).onclick =
  () => {

    modal.classList.remove("show");

    placementMode = true;

    document.getElementById(
      "map-placement-message"
    ).style.display = "block";

  };


map.on(
  "click",
  event => {

    if (!placementMode) return;


    setLocation(
      event.latlng.lat,
      event.latlng.lng,
      "POINT PLACÉ SUR LA CARTE"
    );


    placementMode = false;


    document.getElementById(
      "map-placement-message"
    ).style.display = "none";


    modal.classList.add("show");

  }
);


/* =====================================================
   SUBMIT
===================================================== */

document.getElementById(
  "workForm"
).addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const status =
      document.getElementById(
        "statusMessage"
      );


    status.textContent =
      "ENVOI EN COURS...";


    try {

      const category =
        document.getElementById(
          "category"
        ).value;


      if (!category) {

        throw new Error(
          "Choisis une catégorie."
        );

      }


      if (
        selectedLatitude === null ||
        selectedLongitude === null
      ) {

        throw new Error(
          "Aucune localisation sélectionnée."
        );

      }


      const file =
        document.getElementById(
          "photo"
        ).files[0];


      if (!file) {

        throw new Error(
          "Ajoute une photo."
        );

      }


      /* =========================
         NOM FICHIER
      ========================= */

      const safeName =
        file.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


      const filename =
        `${Date.now()}-${crypto.randomUUID()}-${safeName}`;


      /* =========================
         UPLOAD
      ========================= */

      const uploadResponse =
        await fetch(
          `${SUPABASE_URL}/storage/v1/object/works/${encodeURIComponent(filename)}`,
          {
            method: "POST",

            headers: {
              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_KEY}`,

              "Content-Type":
                file.type ||
                "application/octet-stream",

              "x-upsert":
                "false"
            },

            body: file
          }
        );


      if (!uploadResponse.ok) {

        const errorText =
          await uploadResponse.text();

        throw new Error(
          "UPLOAD PHOTO : " +
          errorText
        );

      }


      const photoUrl =
        `${SUPABASE_URL}/storage/v1/object/public/works/${encodeURIComponent(filename)}`;


      /* =========================
         DATABASE
      ========================= */

      const payload = {

        category:
          category,

        latitude:
          selectedLatitude,

        longitude:
          selectedLongitude,

        photo_url:
          photoUrl,

        date:
          document.getElementById(
            "date"
          ).value,

        status:
          "pending"

      };


      const insertResponse =
        await fetch(
          `${SUPABASE_URL}/rest/v1/works`,
          {

            method: "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_KEY}`,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(payload)

          }
        );


      if (!insertResponse.ok) {

        const errorText =
          await insertResponse.text();

        throw new Error(
          "BASE DE DONNÉES : " +
          errorText
        );

      }


      status.textContent =
        "✓ ŒUVRE ENVOYÉE — EN ATTENTE DE VALIDATION";


      document.getElementById(
        "workForm"
      ).reset();


      selectedLatitude = null;
      selectedLongitude = null;


      document.getElementById(
        "locationInfo"
      ).textContent =
        "AUCUNE LOCALISATION SÉLECTIONNÉE";


      document.getElementById(
        "photoInfo"
      ).style.display =
        "none";


      document.getElementById(
        "date"
      ).value =
        getToday();


      if (temporaryMarker) {

        map.removeLayer(
          temporaryMarker
        );

        temporaryMarker = null;

      }


    } catch (error) {

      console.error(
        error
      );

      status.textContent =
        "ERREUR : " +
        error.message;

    }

  }
);


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
