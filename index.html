<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREET ARCHIVE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #111;
  color: #fff;
}

#app {
  height: 100vh;
  position: relative;
  overflow: hidden;
}

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  filter: grayscale(1) contrast(1.05);
}

.header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 18px;
  pointer-events: none;
}

.logo {
  display: inline-block;
  background: #fff;
  color: #000;
  padding: 7px 10px 5px;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -1.5px;
  line-height: 1;
  box-shadow: 4px 4px 0 #000;
}

.subtitle {
  margin-top: 8px;
  display: inline-block;
  background: #000;
  color: #fff;
  padding: 5px 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
}

.controls {
  position: absolute;
  top: 105px;
  left: 18px;
  right: 18px;
  z-index: 1000;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}

.controls::-webkit-scrollbar {
  display: none;
}

.filter {
  border: 2px solid #000;
  background: #fff;
  color: #000;
  padding: 9px 12px;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .5px;
  white-space: nowrap;
  box-shadow: 3px 3px 0 #000;
}

.filter.active {
  background: #000;
  color: #fff;
}

.add-button {
  position: absolute;
  bottom: 22px;
  left: 18px;
  right: 18px;
  z-index: 1000;
  border: 3px solid #000;
  background: #fff;
  color: #000;
  padding: 16px;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 1px;
  box-shadow: 5px 5px 0 #000;
}

.stats {
  position: absolute;
  bottom: 90px;
  left: 18px;
  z-index: 1000;
  background: #000;
  color: #fff;
  padding: 7px 9px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(0,0,0,.75);
  padding: 18px;
  align-items: center;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.panel {
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  background: #fff;
  color: #000;
  border: 3px solid #000;
  box-shadow: 8px 8px 0 #000;
  padding: 18px;
}

.panel h2 {
  margin: 0 0 18px;
  font-size: 26px;
  letter-spacing: -1px;
}

.close {
  float: right;
  border: 0;
  background: #000;
  color: #fff;
  width: 32px;
  height: 32px;
  font-weight: 900;
  font-size: 18px;
}

label {
  display: block;
  margin-top: 14px;
  margin-bottom: 5px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
}

input, select, textarea {
  width: 100%;
  border: 2px solid #000;
  border-radius: 0;
  padding: 11px;
  font-size: 14px;
  background: #fff;
  color: #000;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.submit {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: 3px solid #000;
  background: #000;
  color: #fff;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1px;
}

#statusMessage {
  margin-top: 12px;
  font-size: 12px;
  font-weight: 700;
}

.archive-popup {
  min-width: 180px;
}

.archive-popup strong {
  font-size: 14px;
}

.archive-popup img {
  width: 100%;
  max-height: 150px;
  object-fit: cover;
  margin-top: 8px;
}

.archive-popup .meta {
  margin-top: 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  border-radius: 0;
}

.leaflet-control-zoom a {
  border-radius: 0 !important;
}

@media (min-width: 700px) {
  .add-button {
    left: auto;
    right: 25px;
    width: 230px;
  }

  .stats {
    left: auto;
    right: 25px;
  }

  .controls {
    right: auto;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="map"></div>

  <header class="header">
    <div class="logo">STREET ARCHIVE</div><br>
    <div class="subtitle">PUBLIC STREET ART DATABASE</div>
  </header>

  <div class="controls">
    <button class="filter active" data-filter="all">ALL</button>
    <button class="filter" data-filter="sticker">STICKER</button>
    <button class="filter" data-filter="tag">TAG</button>
    <button class="filter" data-filter="graff">GRAFF</button>
  </div>

  <div class="stats">
    <span id="counter">0</span> WORKS
  </div>

  <button class="add-button" id="openModal">
    ＋ AJOUTER UNE ŒUVRE
  </button>

</div>

<div class="modal" id="modal">
  <div class="panel">

    <button class="close" id="closeModal">×</button>

    <h2>AJOUTER UNE ŒUVRE</h2>

    <form id="workForm">

      <label>CATÉGORIE *</label>
      <select id="category" required>
        <option value="">Sélectionner</option>
        <option value="sticker">STICKER</option>
        <option value="tag">TAG</option>
        <option value="graff">GRAFF</option>
      </select>

      <label>PHOTO *</label>
      <input type="file" id="photo" accept="image/*" required>

      <label>ARTISTE / PSEUDO</label>
      <input type="text" id="artist" placeholder="@pseudo">

      <label>DATE</label>
      <input type="date" id="date">

      <label>DESCRIPTION</label>
      <textarea id="description" placeholder="Informations sur l'œuvre..."></textarea>

      <label>LATITUDE *</label>
      <input type="number" id="latitude" step="any" required>

      <label>LONGITUDE *</label>
      <input type="number" id="longitude" step="any" required>

      <button type="button" id="locate" class="submit">
        UTILISER MA POSITION
      </button>

      <button type="submit" class="submit">
        ENVOYER POUR VALIDATION
      </button>

      <div id="statusMessage"></div>

    </form>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const SUPABASE_URL = "https://klvcugwhjaxmpvskplqd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsdmN1Z3doamF4bXB2c2twbHFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODQzNTMsImV4cCI6MjEwMjY2MDM1M30.pEvX_uzDvUMTaZbeCWE071718XGGm0YAj6FgZaB6gVE";

const map = L.map("map", {
  zoomControl: false
}).setView([48.8566, 2.3522], 5);

L.control.zoom({
  position: "bottomright"
}).addTo(map);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "© OpenStreetMap contributors"
  }
).addTo(map);

let works = [];
let markers = [];
let currentFilter = "all";

const markerStyles = {
  sticker: {
    radius: 9
  },
  tag: {
    radius: 7
  },
  graff: {
    radius: 11
  }
};

function createMarker(work) {

  const style = markerStyles[work.category] || markerStyles.sticker;

  const marker = L.circleMarker(
    [work.latitude, work.longitude],
    {
      radius: style.radius,
      color: "#000",
      weight: 3,
      fillColor: "#fff",
      fillOpacity: 1
    }
  );

  let html = `
    <div class="archive-popup">
      <strong>${(work.category || "WORK").toUpperCase()} #${work.id}</strong>
  `;

  if (work.photo_url) {
    html += `<img src="${work.photo_url}" alt="">`;
  }

  if (work.artist) {
    html += `<div class="meta">${work.artist}</div>`;
  }

  if (work.date) {
    html += `<div class="meta">${work.date}</div>`;
  }

  if (work.description) {
    html += `<p>${work.description}</p>`;
  }

  html += `</div>`;

  marker.bindPopup(html);

  return marker;
}

function renderMarkers() {

  markers.forEach(marker => map.removeLayer(marker));
  markers = [];

  const filtered = currentFilter === "all"
    ? works
    : works.filter(w => w.category === currentFilter);

  filtered.forEach(work => {
    const marker = createMarker(work);
    marker.addTo(map);
    markers.push(marker);
  });

  document.getElementById("counter").textContent = filtered.length;
}

async function loadWorks() {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/works?select=*&status=eq.approved`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("Impossible de charger les œuvres.");
    }

    works = await response.json();

    renderMarkers();

  } catch (error) {

    console.error(error);

  }
}

document.querySelectorAll(".filter").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".filter")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    currentFilter = button.dataset.filter;

    renderMarkers();

  });

});

const modal = document.getElementById("modal");

document.getElementById("openModal").onclick = () => {
  modal.classList.add("show");
};

document.getElementById("closeModal").onclick = () => {
  modal.classList.remove("show");
};

document.getElementById("locate").onclick = () => {

  if (!navigator.geolocation) {
    alert("La géolocalisation n'est pas disponible.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    position => {

      document.getElementById("latitude").value =
        position.coords.latitude;

      document.getElementById("longitude").value =
        position.coords.longitude;

    },
    () => {
      alert("Impossible d'obtenir votre position.");
    }
  );

};

document.getElementById("workForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const status = document.getElementById("statusMessage");

    status.textContent = "ENVOI EN COURS...";

    try {

      const file =
        document.getElementById("photo").files[0];

      if (!file) {
        throw new Error("Ajoute une photo.");
      }

      const filename =
        `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, "")}`;

      const uploadResponse = await fetch(
        `${SUPABASE_URL}/storage/v1/object/works/${filename}`,
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": file.type
          },
          body: file
        }
      );

      if (!uploadResponse.ok) {
        throw new Error(
          "La photo n'a pas pu être envoyée. Les permissions du stockage doivent encore être configurées."
        );
      }

      const photoUrl =
        `${SUPABASE_URL}/storage/v1/object/public/works/${filename}`;

      const payload = {
        category: document.getElementById("category").value,
        latitude: Number(document.getElementById("latitude").value),
        longitude: Number(document.getElementById("longitude").value),
        photo_url: photoUrl,
        artist: document.getElementById("artist").value || null,
        description: document.getElementById("description").value || null,
        date: document.getElementById("date").value || null,
        status: "pending"
      };

      const insertResponse = await fetch(
        `${SUPABASE_URL}/rest/v1/works`,
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify(payload)
        }
      );

      if (!insertResponse.ok) {
        throw new Error(
          "L'œuvre n'a pas pu être enregistrée."
        );
      }

      status.textContent =
        "✓ ŒUVRE ENVOYÉE — EN ATTENTE DE VALIDATION.";

      document.getElementById("workForm").reset();

    } catch (error) {

      console.error(error);

      status.textContent =
        "ERREUR : " + error.message;

    }

  }
);

loadWorks();
</script>

</body>
</html>
