<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALEN WORLD</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #f4f4f0;
  color: #111;

  font-family: Arial, Helvetica, sans-serif;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
}


/* =========================
   MAP
========================= */

#map {
  position: absolute;
  inset: 0;
  z-index: 1;

  filter: grayscale(1) contrast(.9);
}


/* =========================
   HEADER
========================= */

.header {
  position: absolute;

  top: 16px;
  left: 16px;

  z-index: 1000;

  pointer-events: none;
}

.logo {
  display: inline-block;

  padding: 4px 7px 3px;

  border: 2px solid #111;

  background: #f4f4f0;

  font-size: 25px;
  line-height: 1;

  font-weight: 900;

  letter-spacing: -1.8px;
}

.subtitle {
  display: inline-block;

  margin-top: 5px;

  padding: 4px 6px;

  border: 1px dashed #111;

  background: #f4f4f0;

  font-size: 9px;

  font-weight: 700;

  letter-spacing: 1.5px;
}


/* =========================
   FILTERS
========================= */

.controls {
  position: absolute;

  top: 88px;
  left: 16px;
  right: 16px;

  z-index: 1000;

  display: flex;
  gap: 5px;

  overflow-x: auto;

  scrollbar-width: none;
}

.controls::-webkit-scrollbar {
  display: none;
}

.filter {
  flex-shrink: 0;

  padding: 7px 10px;

  border: 1px solid #111;

  border-radius: 0;

  background: #f4f4f0;
  color: #111;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 1px;
}

.filter.active {
  background: #111;
  color: #f4f4f0;
}


/* =========================
   COUNTER
========================= */

.stats {
  position: absolute;

  left: 16px;
  bottom: 85px;

  z-index: 1000;

  padding: 5px 7px;

  border: 1px dashed #111;

  background: rgba(244,244,240,.9);

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   ADD BUTTON
========================= */

.add-button {
  position: absolute;

  left: 16px;
  right: 16px;
  bottom: 18px;

  z-index: 1000;

  padding: 14px;

  border: 2px solid #111;

  border-radius: 0;

  background: #f4f4f0;
  color: #111;

  font-size: 12px;

  font-weight: 900;

  letter-spacing: 1.2px;
}

.add-button:active {
  background: #111;
  color: #f4f4f0;
}


/* =========================
   MODAL
========================= */

.modal {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 3000;

  padding: 15px;

  background: rgba(0,0,0,.65);

  align-items: center;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.panel {
  width: 100%;
  max-width: 500px;

  max-height: 92vh;

  overflow-y: auto;

  padding: 17px;

  background: #f4f4f0;

  color: #111;

  border: 2px solid #111;
}

.panel h2 {
  margin: 0 0 18px;

  font-size: 24px;

  line-height: 1;

  letter-spacing: -1px;
}

.close {
  float: right;

  width: 30px;
  height: 30px;

  border: 1px solid #111;

  border-radius: 0;

  background: transparent;

  color: #111;

  font-size: 18px;

  font-weight: 900;
}


/* =========================
   FORM
========================= */

label {
  display: block;

  margin-top: 14px;
  margin-bottom: 5px;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1.2px;
}

input,
select {
  width: 100%;

  padding: 10px;

  border: 1px solid #111;

  border-radius: 0;

  background: transparent;

  color: #111;

  font-size: 14px;
}


/* =========================
   PHOTO PREVIEW
========================= */

.photo-preview {
  display: none;

  width: 100%;

  max-height: 220px;

  margin-top: 8px;

  object-fit: cover;

  border: 1px solid #111;

  filter: grayscale(1);
}

.photo-preview.show {
  display: block;
}

.photo-gps-status {
  margin-top: 6px;

  padding: 7px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 900;

  line-height: 1.4;
}


/* =========================
   LOCATION
========================= */

.location-buttons {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 6px;

  margin-top: 7px;
}

.location-button {
  padding: 11px 7px;

  border: 1px solid #111;

  border-radius: 0;

  background: transparent;

  color: #111;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: .7px;
}

.location-button.active {
  background: #111;

  color: #f4f4f0;
}

.location-info {
  margin-top: 7px;

  padding: 7px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 700;

  line-height: 1.4;
}


/* =========================
   SUBMIT
========================= */

.submit {
  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border: 2px solid #111;

  border-radius: 0;

  background: #111;

  color: #f4f4f0;

  font-size: 11px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   POPUP
========================= */

.archive-popup {
  min-width: 170px;
}

.archive-popup strong {
  font-size: 13px;

  letter-spacing: .5px;
}

.archive-popup img {
  width: 100%;

  max-height: 150px;

  object-fit: cover;

  margin-top: 8px;

  filter: grayscale(1);
}

.archive-popup .meta {
  margin-top: 5px;

  font-size: 9px;

  font-weight: 900;

  text-transform: uppercase;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  border-radius: 0;

  box-shadow: none;
}

.leaflet-popup-content {
  margin: 10px;
}

.leaflet-control-zoom a {
  border-radius: 0 !important;
}


/* =========================
   MAP PLACEMENT
========================= */

#map-placement-message {
  display: none;

  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  z-index: 2500;

  padding: 10px 12px;

  border: 2px solid #111;

  background: #f4f4f0;

  font-size: 11px;

  font-weight: 900;

  letter-spacing: 1px;

  text-align: center;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

  .logo {
    font-size: 23px;
  }

}


/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

  .add-button {
    left: auto;

    right: 20px;

    width: 230px;
  }

  .stats {
    left: auto;

    right: 20px;
  }

  .controls {
    right: auto;
  }

}

</style>
</head>


<body>

<div id="app">


  <!-- MAP -->

  <div id="map"></div>


  <!-- MAP PLACEMENT MESSAGE -->

  <div id="map-placement-message">
    TOUCHEZ LA CARTE POUR PLACER L'ŒUVRE
  </div>


  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      VALEN WORLD
    </div>

    <br>

    <div class="subtitle">
      STREET ART / PUBLIC ARCHIVE
    </div>

  </header>


  <!-- FILTERS -->

  <div class="controls">

    <button
      class="filter active"
      data-filter="all"
    >
      ALL
    </button>

    <button
      class="filter"
      data-filter="sticker"
    >
      STICKER
    </button>

    <button
      class="filter"
      data-filter="tag"
    >
      TAG
    </button>

    <button
      class="filter"
      data-filter="graff"
    >
      GRAFF
    </button>

  </div>


  <!-- COUNTER -->

  <div class="stats">

    <span id="counter">
      0
    </span>

    &nbsp;WORKS

  </div>


  <!-- ADD -->

  <button
    class="add-button"
    id="openModal"
  >
    ＋ AJOUTER UNE ŒUVRE
  </button>


</div>



<!-- =========================
     FORM MODAL
========================= -->

<div
  class="modal"
  id="modal"
>

  <div class="panel">


    <button
      class="close"
      id="closeModal"
    >
      ×
    </button>


    <h2>
      AJOUTER UNE ŒUVRE
    </h2>


    <form id="workForm">


      <!-- CATEGORY -->

      <label>
        CATÉGORIE *
      </label>


      <select
        id="category"
        required
      >

        <option value="">
          Sélectionner
        </option>

        <option value="sticker">
          STICKER
        </option>

        <option value="tag">
          TAG
        </option>

        <option value="graff">
          GRAFF
        </option>

      </select>


      <!-- PHOTO -->

      <label>
        PHOTO *
      </label>


      <input
        type="file"
        id="photo"
        accept="image/*"
        required
      >


      <img
        id="photoPreview"
        class="photo-preview"
        alt="Prévisualisation"
      >


      <div
        id="photoGpsStatus"
        class="photo-gps-status"
      >
        AUCUNE PHOTO SÉLECTIONNÉE
      </div>


      <!-- LOCATION -->

      <label>
        LOCALISATION *
      </label>


      <input
        type="text"
        id="address"
        placeholder="Entrer une adresse"
      >


      <div class="location-buttons">


        <button
          type="button"
          class="location-button"
          id="addressButton"
        >
          UTILISER L'ADRESSE
        </button>


        <button
          type="button"
          class="location-button"
          id="gpsButton"
        >
          MA POSITION
        </button>


      </div>


      <button
        type="button"
        class="location-button"
        id="mapButton"
        style="width:100%;margin-top:6px;"
      >
        PLACER SUR LA CARTE
      </button>


      <div
        class="location-info"
        id="locationInfo"
      >
        AUCUNE LOCALISATION SÉLECTIONNÉE
      </div>


      <!-- DATE -->

      <label>
        DATE *
      </label>


      <input
        type="date"
        id="date"
        required
      >


      <!-- SUBMIT -->

      <button
        type="submit"
        class="submit"
      >
        ENVOYER POUR VALIDATION
      </button>


      <div
        id="statusMessage"
      ></div>


    </form>

  </div>

</div>



<!-- LEAFLET -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<!-- EXIF / GPS -->

<script
  src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"
></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://klvcugwhjaxmpvskplqd.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXAiLCJyZWYiOiJrbHZjdWd3aGpheG1wdnNrcGxxZCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg3MDg0MzUzLCJleHAiOjIxMDI2NjAzNTN9.pEvX_uzDvUMTaZbeCWE071718XGGm0YAj6FgZaB6gVE";


/* =========================
   MAP
========================= */

const map =
  L.map(
    "map",
    {
      zoomControl: false
    }
  ).setView(
    [48.8566, 2.3522],
    5
  );


L.control.zoom({
  position: "bottomright"
}).addTo(map);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
      "© OpenStreetMap contributors"
  }
).addTo(map);


/* =========================
   DATA
========================= */

let works = [];

let markers = [];

let currentFilter = "all";

let selectedLatitude = null;

let selectedLongitude = null;

let placementMode = false;

let temporaryMarker = null;


/* =========================
   TODAY
========================= */

const today =
  new Date();


const localDate =
  today.getFullYear() +
  "-" +
  String(
    today.getMonth() + 1
  ).padStart(2, "0") +
  "-" +
  String(
    today.getDate()
  ).padStart(2, "0");


document.getElementById(
  "date"
).value =
  localDate;


/* =========================
   MARKER STYLES
========================= */

const markerStyles = {

  sticker: {
    radius: 7,
    dashArray: null
  },

  tag: {
    radius: 6,
    dashArray: "2,4"
  },

  graff: {
    radius: 10,
    dashArray: null
  }

};


/* =========================
   CREATE MARKER
========================= */

function createMarker(work) {

  const style =
    markerStyles[
      work.category
    ] ||
    markerStyles.sticker;


  const marker =
    L.circleMarker(
      [
        work.latitude,
        work.longitude
      ],
      {

        radius:
          style.radius,

        color:
          "#111",

        weight:
          2,

        dashArray:
          style.dashArray,

        fillColor:
          "#f4f4f0",

        fillOpacity:
          1

      }
    );


  let html = `

    <div class="archive-popup">

      <strong>

        ${
          (
            work.category ||
            "WORK"
          ).toUpperCase()
        }

        #${work.id}

      </strong>

  `;


  if (work.photo_url) {

    html += `

      <img
        src="${escapeHTML(work.photo_url)}"
        alt=""
      >

    `;

  }


  if (work.date) {

    html += `

      <div class="meta">

        ${escapeHTML(work.date)}

      </div>

    `;

  }


  html += `
    </div>
  `;


  marker.bindPopup(
    html
  );


  return marker;

}


/* =========================
   RENDER MARKERS
========================= */

function renderMarkers() {

  markers.forEach(
    marker =>
      map.removeLayer(
        marker
      )
  );


  markers = [];


  const filtered =
    currentFilter === "all"
      ? works
      : works.filter(
          work =>
            work.category ===
            currentFilter
        );


  filtered.forEach(
    work => {

      const marker =
        createMarker(
          work
        );


      marker.addTo(
        map
      );


      markers.push(
        marker
      );

    }
  );


  document.getElementById(
    "counter"
  ).textContent =
    filtered.length;

}


/* =========================
   LOAD WORKS
========================= */

async function loadWorks() {

  try {

    const response =
      await fetch(

        `${SUPABASE_URL}/rest/v1/works?select=*&status=eq.approved`,

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`

          }

        }

      );


    if (!response.ok) {

      throw new Error(
        "Impossible de charger les œuvres."
      );

    }


    works =
      await response.json();


    renderMarkers();


  } catch (error) {

    console.error(
      error
    );

  }

}


loadWorks();


/* =========================
   FILTERS
========================= */

document
  .querySelectorAll(
    ".filter"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".filter"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentFilter =
            button.dataset.filter;


          renderMarkers();

        }
      );

    }
  );


/* =========================
   MODAL
========================= */

const modal =
  document.getElementById(
    "modal"
  );


document.getElementById(
  "openModal"
).onclick = () => {

  modal.classList.add(
    "show"
  );

};


document.getElementById(
  "closeModal"
).onclick = () => {

  modal.classList.remove(
    "show"
  );

};


/* =========================
   LOCATION
========================= */

function setLocation(
  latitude,
  longitude,
  label
) {

  selectedLatitude =
    latitude;

  selectedLongitude =
    longitude;


  document.getElementById(
    "locationInfo"
  ).textContent =
    label;


  if (
    temporaryMarker
  ) {

    map.removeLayer(
      temporaryMarker
    );

  }


  temporaryMarker =
    L.circleMarker(
      [
        latitude,
        longitude
      ],
      {

        radius:
          8,

        color:
          "#111",

        weight:
          2,

        dashArray:
          "3,3",

        fillColor:
          "#f4f4f0",

        fillOpacity:
          1

      }
    ).addTo(
      map
    );

}


/* =========================
   PHOTO PREVIEW + GPS EXIF
========================= */

document.getElementById(
  "photo"
).addEventListener(
  "change",
  async function() {

    const file =
      this.files[0];


    const preview =
      document.getElementById(
        "photoPreview"
      );


    const gpsStatus =
      document.getElementById(
        "photoGpsStatus"
      );


    if (!file) {

      preview.src = "";

      preview.classList.remove(
        "show"
      );

      gpsStatus.textContent =
        "AUCUNE PHOTO SÉLECTIONNÉE";

      return;

    }


    /* =====================
       PREVIEW
    ===================== */

    const imageUrl =
      URL.createObjectURL(
        file
      );


    preview.src =
      imageUrl;


    preview.classList.add(
      "show"
    );


    /* =====================
       RESET LOCATION
    ===================== */

    selectedLatitude =
      null;

    selectedLongitude =
      null;


    if (
      temporaryMarker
    ) {

      map.removeLayer(
        temporaryMarker
      );

      temporaryMarker =
        null;

    }


    document.getElementById(
      "locationInfo"
    ).textContent =
      "RECHERCHE DU GPS DE LA PHOTO...";


    gpsStatus.textContent =
      "LECTURE DES MÉTADONNÉES GPS...";


    /* =====================
       EXIF GPS
    ===================== */

    try {

      const gps =
        await exifr.gps(
          file
        );


      if (
        !gps ||
        typeof gps.latitude !== "number" ||
        typeof gps.longitude !== "number"
      ) {

        gpsStatus.textContent =
          "○ AUCUN GPS DANS LA PHOTO";


        document.getElementById(
          "locationInfo"
        ).textContent =
          "AUCUNE LOCALISATION — UTILISE UNE ADRESSE OU LA CARTE.";


        return;

      }


      const latitude =
        gps.latitude;


      const longitude =
        gps.longitude;


      if (
        latitude < -90 ||
        latitude > 90 ||
        longitude < -180 ||
        longitude > 180
      ) {

        throw new Error(
          "Coordonnées GPS invalides."
        );

      }


      /* =====================
         AUTO LOCATION
      ===================== */

      setLocation(

        latitude,

        longitude,

        "✓ LOCALISATION GPS DE LA PHOTO"

      );


      map.setView(
        [
          latitude,
          longitude
        ],
        17
      );


      gpsStatus.textContent =
        "✓ GPS TROUVÉ — LOCALISATION AUTOMATIQUE";


      document.getElementById(
        "locationInfo"
      ).textContent =

        "✓ GPS DE LA PHOTO : " +
        latitude.toFixed(6) +
        " , " +
        longitude.toFixed(6);


    } catch (
      error
    ) {

      console.warn(
        "GPS EXIF impossible :",
        error
      );


      gpsStatus.textContent =
        "○ GPS NON DISPONIBLE";


      document.getElementById(
        "locationInfo"
      ).textContent =
        "AUCUNE LOCALISATION — UTILISE UNE ADRESSE OU LA CARTE.";

    }

  }
);


/* =========================
   ADDRESS SEARCH
========================= */

document.getElementById(
  "addressButton"
).onclick =
  async () => {

    const address =
      document.getElementById(
        "address"
      ).value.trim();


    if (!address) {

      alert(
        "Entre une adresse."
      );

      return;

    }


    const button =
      document.getElementById(
        "addressButton"
      );


    button.textContent =
      "RECHERCHE...";


    try {

      const response =
        await fetch(

          "https://nominatim.openstreetmap.org/search?" +

          new URLSearchParams({

            q:
              address,

            format:
              "json",

            limit:
              "1"

          }),

          {

            headers: {

              "Accept-Language":
                "fr"

            }

          }

        );


      const results =
        await response.json();


      if (
        !results.length
      ) {

        throw new Error(
          "Adresse introuvable."
        );

      }


      const result =
        results[0];


      const latitude =
        Number(
          result.lat
        );


      const longitude =
        Number(
          result.lon
        );


      setLocation(

        latitude,

        longitude,

        "ADRESSE : " +
        result.display_name

      );


      map.setView(
        [
          latitude,
          longitude
        ],
        17
      );


    } catch (
      error
    ) {

      alert(
        error.message
      );

    }


    button.textContent =
      "UTILISER L'ADRESSE";

  };


/* =========================
   GPS / CURRENT POSITION
========================= */

document.getElementById(
  "gpsButton"
).onclick =
  () => {

    if (
      !navigator.geolocation
    ) {

      alert(
        "La géolocalisation n'est pas disponible."
      );

      return;

    }


    const button =
      document.getElementById(
        "gpsButton"
      );


    button.textContent =
      "LOCALISATION...";


    navigator.geolocation
      .getCurrentPosition(

        position => {

          const latitude =
            position.coords.latitude;


          const longitude =
            position.coords.longitude;


          setLocation(

            latitude,

            longitude,

            "POSITION ACTUELLE"

          );


          map.setView(
            [
              latitude,
              longitude
            ],
            17
          );


          button.textContent =
            "MA POSITION";

        },

        () => {

          button.textContent =
            "MA POSITION";


          alert(
            "Impossible d'obtenir votre position."
          );

        }

      );

  };


/* =========================
   PLACE ON MAP
========================= */

document.getElementById(
  "mapButton"
).onclick =
  () => {

    modal.classList.remove(
      "show"
    );


    placementMode =
      true;


    document.getElementById(
      "map-placement-message"
    ).style.display =
      "block";

  };


map.on(
  "click",
  event => {

    if (
      !placementMode
    ) {

      return;

    }


    const latitude =
      event.latlng.lat;


    const longitude =
      event.latlng.lng;


    setLocation(

      latitude,

      longitude,

      "POINT PLACÉ SUR LA CARTE"

    );


    placementMode =
      false;


    document.getElementById(
      "map-placement-message"
    ).style.display =
      "none";


    modal.classList.add(
      "show"
    );

  }
);


/* =========================
   FORM SUBMIT
========================= */

document.getElementById(
  "workForm"
).addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const status =
      document.getElementById(
        "statusMessage"
      );


    status.textContent =
      "ENVOI EN COURS...";


    if (
      selectedLatitude === null ||
      selectedLongitude === null
    ) {

      status.textContent =
        "CHOISIS UNE LOCALISATION.";

      return;

    }


    try {

      const file =
        document.getElementById(
          "photo"
        ).files[0];


      if (!file) {

        throw new Error(
          "Ajoute une photo."
        );

      }


      /* =====================
         UPLOAD PHOTO
      ===================== */

      const safeFilename =
        file.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            ""
          );


      const filename =
        `${Date.now()}-${safeFilename}`;


      const uploadResponse =
        await fetch(

          `${SUPABASE_URL}/storage/v1/object/works/${filename}`,

          {

            method:
              "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_KEY}`,

              "Content-Type":
                file.type

            },

            body:
              file

          }

        );


      if (
        !uploadResponse.ok
      ) {

        const uploadError =
          await uploadResponse.text();


        console.error(
          uploadError
        );


        throw new Error(
          "La photo n'a pas pu être envoyée."
        );

      }


      const photoUrl =
        `${SUPABASE_URL}/storage/v1/object/public/works/${filename}`;


      /* =====================
         DATABASE
      ===================== */

      const payload = {

        category:
          document.getElementById(
            "category"
          ).value,

        latitude:
          selectedLatitude,

        longitude:
          selectedLongitude,

        photo_url:
          photoUrl,

        date:
          document.getElementById(
            "date"
          ).value,

        status:
          "pending"

      };


      const insertResponse =
        await fetch(

          `${SUPABASE_URL}/rest/v1/works`,

          {

            method:
              "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_KEY}`,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(
                payload
              )

          }

        );


      if (
        !insertResponse.ok
      ) {

        const insertError =
          await insertResponse.text();


        console.error(
          insertError
        );


        throw new Error(
          "L'œuvre n'a pas pu être enregistrée."
        );

      }


      /* =====================
         SUCCESS
      ===================== */

      status.textContent =
        "✓ ENVOYÉ — EN ATTENTE DE VALIDATION";


      document
        .getElementById(
          "workForm"
        )
        .reset();


      selectedLatitude =
        null;

      selectedLongitude =
        null;


      document.getElementById(
        "locationInfo"
      ).textContent =
        "AUCUNE LOCALISATION SÉLECTIONNÉE";


      document.getElementById(
        "photoGpsStatus"
      ).textContent =
        "AUCUNE PHOTO SÉLECTIONNÉE";


      document.getElementById(
        "photoPreview"
      ).src = "";


      document.getElementById(
        "photoPreview"
      ).classList.remove(
        "show"
      );


      if (
        temporaryMarker
      ) {

        map.removeLayer(
          temporaryMarker
        );

        temporaryMarker =
          null;

      }


      /*
        Date automatiquement remise
        à aujourd'hui.
      */

      document.getElementById(
        "date"
      ).value =
        localDate;


    } catch (
      error
    ) {

      console.error(
        error
      );


      status.textContent =
        "ERREUR : " +
        error.message;

    }

  }
);


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
