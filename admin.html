<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>VALEN WORLD — ADMIN</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: #f4f4f0;
  color: #111;

  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}


/* =========================
   LOGIN
========================= */

#loginScreen {

  min-height: 100vh;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

.login-box {

  width: 100%;
  max-width: 400px;

  padding: 20px;

  border: 2px solid #111;

  background: #f4f4f0;
}

.logo {

  display: inline-block;

  padding: 5px 7px 4px;

  border: 2px solid #111;

  font-size: 22px;

  font-weight: 900;

  letter-spacing: -1.5px;
}

.admin-label {

  margin-top: 6px;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1.5px;
}

.login-box h1 {

  margin: 25px 0 20px;

  font-size: 28px;

  letter-spacing: -1.5px;
}

label {

  display: block;

  margin: 13px 0 5px;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

input {

  width: 100%;

  padding: 11px;

  border: 1px solid #111;

  border-radius: 0;

  background: transparent;
}

.login-button {

  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border: 2px solid #111;

  background: #111;

  color: #f4f4f0;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 1px;
}

.error {

  margin-top: 10px;

  font-size: 10px;

  font-weight: 900;
}


/* =========================
   HEADER
========================= */

header {

  padding: 16px;

  border-bottom: 2px solid #111;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;
}

.logout {

  padding: 8px 10px;

  border: 1px solid #111;

  border-radius: 0;

  background: transparent;

  font-size: 9px;

  font-weight: 900;
}


/* =========================
   MAIN
========================= */

main {

  width: 100%;

  max-width: 1100px;

  margin: auto;

  padding: 18px 16px 40px;
}

.top {

  display: flex;

  align-items: end;

  justify-content: space-between;

  gap: 10px;

  margin-bottom: 18px;
}

h1 {

  margin: 0;

  font-size: 28px;

  line-height: 1;

  letter-spacing: -1.5px;
}

.counter {

  padding: 6px 8px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   WORKS GRID
========================= */

#works {

  display: grid;

  gap: 18px;
}

.work {

  border: 2px solid #111;

  background: #f4f4f0;
}


/* =========================
   PHOTO
========================= */

.photo {

  width: 100%;

  max-height: 500px;

  object-fit: cover;

  display: block;

  border-bottom: 1px solid #111;
}


/* =========================
   INFO
========================= */

.info {

  padding: 13px;
}

.category {

  display: inline-block;

  padding: 5px 7px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

.date {

  margin-top: 8px;

  font-size: 10px;

  font-weight: 700;
}

.location-text {

  margin-top: 7px;

  padding: 8px;

  border: 1px dashed #111;

  font-size: 9px;

  line-height: 1.4;
}

.location-coordinates {

  margin-top: 5px;

  font-size: 9px;

  opacity: .7;
}


/* =========================
   MAP
========================= */

.admin-map {

  width: 100%;

  height: 300px;

  margin-top: 12px;

  border: 1px solid #111;

  filter: grayscale(1) contrast(.9);
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

  border-radius: 0;

  box-shadow: none;
}

.leaflet-control-zoom a {

  border-radius: 0 !important;
}


/* =========================
   MAP INFO
========================= */

.map-help {

  margin-top: 5px;

  font-size: 8px;

  font-weight: 900;

  letter-spacing: .8px;
}


/* =========================
   ACTIONS
========================= */

.actions {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 7px;

  margin-top: 15px;
}

.approve,
.reject {

  padding: 12px;

  border-radius: 0;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: .8px;
}

.approve {

  border: 2px solid #111;

  background: #111;

  color: #f4f4f0;
}

.reject {

  border: 1px solid #111;

  background: transparent;

  color: #111;
}

.status {

  margin-top: 10px;

  font-size: 10px;

  font-weight: 900;
}


/* =========================
   EMPTY
========================= */

.empty {

  padding: 30px 15px;

  border: 1px dashed #111;

  text-align: center;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

  #works {

    grid-template-columns:
      repeat(2, 1fr);
  }

  .photo {

    height: 350px;
  }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

  <div class="login-box">

    <div class="logo">
      VALEN WORLD
    </div>

    <div class="admin-label">
      ADMINISTRATION
    </div>

    <h1>
      CONNEXION
    </h1>

    <form id="loginForm">

      <label>
        EMAIL
      </label>

      <input
        type="email"
        id="email"
        required
        autocomplete="email"
      >

      <label>
        MOT DE PASSE
      </label>

      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
      >

      <button
        class="login-button"
        type="submit"
      >
        SE CONNECTER
      </button>

      <div
        class="error"
        id="loginError"
      ></div>

    </form>

  </div>

</section>


<!-- =========================
     ADMIN
========================= -->

<div
  id="adminApp"
  style="display:none;"
>

<header>

  <div>

    <div class="logo">
      VALEN WORLD
    </div>

    <div class="admin-label">
      ADMINISTRATION
    </div>

  </div>

  <button
    class="logout"
    id="logout"
  >
    DÉCONNEXION
  </button>

</header>


<main>

  <div class="top">

    <h1>
      À VALIDER
    </h1>

    <div class="counter">

      <span id="counter">
        0
      </span>

      EN ATTENTE

    </div>

  </div>


  <div id="works"></div>

</main>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://klvcugwhjaxmpvskplqd.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_AAzooie5TH6HNzupodCrvQ_nWrY0D_t";


/* =========================
   TOKEN
========================= */

function getToken() {

  return localStorage.getItem(
    "valen_access_token"
  );

}


/* =========================
   AUTH REQUEST
========================= */

async function supabaseAuthRequest(
  url,
  options = {}
) {

  return fetch(

    `${SUPABASE_URL}${url}`,

    {

      ...options,

      headers: {

        "apikey":
          SUPABASE_KEY,

        ...options.headers

      }

    }

  );

}


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const error =
        document
          .getElementById("loginError");


      error.textContent =
        "CONNEXION...";


      try {

        const response =
          await supabaseAuthRequest(

            "/auth/v1/token?grant_type=password",

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  email:
                    email,

                  password:
                    password

                })

            }

          );


        const data =
          await response.json();


        if (
          !response.ok
        ) {

          throw new Error(

            data.error_description ||
            data.msg ||
            "Connexion impossible."

          );

        }


        localStorage.setItem(

          "valen_access_token",

          data.access_token

        );


        localStorage.setItem(

          "valen_refresh_token",

          data.refresh_token

        );


        showAdmin();


      } catch (err) {

        error.textContent =
          err.message;

      }

    }

  );


/* =========================
   SHOW ADMIN
========================= */

function showAdmin() {

  document
    .getElementById("loginScreen")
    .style.display =
    "none";


  document
    .getElementById("adminApp")
    .style.display =
    "block";


  loadPendingWorks();

}


/* =========================
   LOAD PENDING WORKS
========================= */

async function loadPendingWorks() {

  const container =
    document.getElementById(
      "works"
    );


  container.innerHTML = `

    <div class="empty">
      CHARGEMENT...
    </div>

  `;


  try {

    const token =
      getToken();


    if (!token) {

      throw new Error(
        "Session expirée."
      );

    }


    /*
      IMPORTANT :
      La colonne de ta table s'appelle Id
      avec un I majuscule.
    */

    const url =

      `${SUPABASE_URL}/rest/v1/works` +

      `?select=*` +

      `&status=eq.pending`;


    const response =
      await fetch(

        url,

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`

          }

        }

      );


    const data =
      await response.json();


    if (
      !response.ok
    ) {

      throw new Error(

        data.message ||
        JSON.stringify(data)

      );

    }


    document
      .getElementById("counter")
      .textContent =
      data.length;


    if (
      data.length === 0
    ) {

      container.innerHTML = `

        <div class="empty">

          AUCUNE ŒUVRE EN ATTENTE

        </div>

      `;

      return;

    }


    container.innerHTML =
      "";


    data.forEach(
      work => {

        container.appendChild(

          createWorkCard(
            work
          )

        );

      }

    );


  } catch (error) {

    console.error(
      error
    );


    container.innerHTML = `

      <div class="empty">

        ERREUR DE CHARGEMENT

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   CREATE WORK CARD
========================= */

function createWorkCard(
  work
) {

  const article =
    document.createElement(
      "article"
    );


  article.className =
    "work";


  /*
    On utilise Id et non id.
  */

  const workId =
    work.Id;


  /*
    Sécurité contre undefined.
  */

  if (
    workId === undefined ||
    workId === null
  ) {

    console.error(
      "Œuvre sans Id :",
      work
    );

  }


  const latitude =
    Number(
      work.latitude
    );


  const longitude =
    Number(
      work.longitude
    );


  const validCoordinates =
    Number.isFinite(
      latitude
    ) &&
    Number.isFinite(
      longitude
    );


  article.innerHTML = `

    ${
      work.photo_url
      ?
      `
        <img
          class="photo"
          src="${escapeHTML(
            work.photo_url
          )}"
          alt="Œuvre"
        >
      `
      :
      ""
    }


    <div class="info">

      <div class="category">

        ${escapeHTML(

          (
            work.category ||
            "WORK"
          ).toUpperCase()

        )}

      </div>


      <div class="date">

        DATE :

        ${escapeHTML(
          work.date ||
          "—"
        )}

      </div>


      <div class="location-text">

        <strong>
          LOCALISATION
        </strong>

        <br>

        ${
          work.address
          ?
          escapeHTML(
            work.address
          )
          :
          "Adresse non enregistrée — position GPS ci-dessous."
        }

      </div>


      <div class="location-coordinates">

        ${
          validCoordinates
          ?
          `
            ${latitude.toFixed(6)}
            ,
            ${longitude.toFixed(6)}
          `
          :
          "COORDONNÉES INVALIDES"
        }

      </div>


      <div
        class="admin-map"
        id="map-${workId}"
      ></div>


      <div class="map-help">

        DÉPLACE LE POINT SUR LA CARTE POUR
        CORRIGER LA LOCALISATION

      </div>


      <div class="actions">

        <button
          class="approve"
          type="button"
        >
          ✓ APPROUVER
        </button>


        <button
          class="reject"
          type="button"
        >
          ✕ REFUSER
        </button>

      </div>


      <div
        class="status"
        id="status-${workId}"
      ></div>

    </div>

  `;


  /*
    Création de la carte APRÈS
    insertion de l'élément dans le DOM.
    Cela évite définitivement :
    "Map container not found"
  */

  if (
    validCoordinates &&
    workId !== undefined
  ) {

    setTimeout(
      () => {

        createAdminMap(

          workId,

          latitude,

          longitude,

          work

        );

      },
      0
    );

  }


  /*
    APPROUVER
  */

  article
    .querySelector(
      ".approve"
    )
    .addEventListener(
      "click",
      () => {

        moderateWork(

          workId,

          "approved"

        );

      }
    );


  /*
    REFUSER
  */

  article
    .querySelector(
      ".reject"
    )
    .addEventListener(
      "click",
      () => {

        moderateWork(

          workId,

          "rejected"

        );

      }
    );


  return article;

}


/* =========================
   ADMIN MAP
========================= */

function createAdminMap(

  workId,

  latitude,

  longitude,

  work

) {

  const container =
    document.getElementById(
      `map-${workId}`
    );


  if (!container) {

    console.error(
      "Conteneur carte introuvable",
      workId
    );

    return;

  }


  /*
    Protection supplémentaire :
    on ne crée jamais deux cartes
    dans le même conteneur.
  */

  if (
    container._leaflet_id
  ) {

    return;

  }


  const adminMap =
    L.map(

      container,

      {

        zoomControl:
          true,

        attributionControl:
          true

      }

    ).setView(

      [
        latitude,
        longitude
      ],

      16

    );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      attribution:
        "© OpenStreetMap contributors"

    }

  ).addTo(
    adminMap
  );


  /*
    Point déplaçable
  */

  const marker =
    L.marker(

      [
        latitude,
        longitude
      ],

      {

        draggable:
          true

      }

    ).addTo(
      adminMap
    );


  marker.bindPopup(

    "LOCALISATION DE L'ŒUVRE"

  );


  /*
    Quand on déplace le point,
    on met immédiatement à jour
    les coordonnées de l'œuvre.
  */

  marker.on(
    "dragend",
    async () => {

      const position =
        marker.getLatLng();


      const newLatitude =
        position.lat;


      const newLongitude =
        position.lng;


      await saveLocation(

        workId,

        newLatitude,

        newLongitude

      );

    }
  );


  /*
    Double clic / clic sur carte :
    place directement le point.
  */

  adminMap.on(
    "click",
    event => {

      const newLatitude =
        event.latlng.lat;


      const newLongitude =
        event.latlng.lng;


      marker.setLatLng(

        [
          newLatitude,
          newLongitude
        ]

      );


      saveLocation(

        workId,

        newLatitude,

        newLongitude

      );

    }
  );


  /*
    Permet de redimensionner correctement
    Leaflet après affichage.
  */

  setTimeout(
    () => {

      adminMap.invalidateSize();

    },
    100
  );

}


/* =========================
   SAVE LOCATION
========================= */

async function saveLocation(

  workId,

  latitude,

  longitude

) {

  const statusElement =
    document.getElementById(

      `status-${workId}`

    );


  if (
    workId === undefined ||
    workId === null
  ) {

    if (statusElement) {

      statusElement.textContent =
        "ERREUR : ID MANQUANT";

    }

    return;

  }


  if (
    !Number.isFinite(
      latitude
    ) ||
    !Number.isFinite(
      longitude
    )
  ) {

    return;

  }


  if (statusElement) {

    statusElement.textContent =
      "LOCALISATION ENREGISTRÉE...";

  }


  try {

    const token =
      getToken();


    /*
      IMPORTANT :
      Id avec I majuscule.
    */

    const response =
      await fetch(

        `${SUPABASE_URL}/rest/v1/works?Id=eq.${encodeURIComponent(
          workId
        )}`,

        {

          method:
            "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              latitude:
                latitude,

              longitude:
                longitude

            })

        }

      );


    if (
      !response.ok
    ) {

      const error =
        await response.text();


      throw new Error(
        error
      );

    }


    if (statusElement) {

      statusElement.textContent =
        "✓ LOCALISATION MODIFIÉE";

    }


  } catch (error) {

    console.error(
      error
    );


    if (statusElement) {

      statusElement.textContent =

        "ERREUR LOCALISATION : " +
        error.message;

    }

  }

}


/* =========================
   MODERATION
========================= */

async function moderateWork(

  workId,

  newStatus

) {

  const statusElement =
    document.getElementById(

      `status-${workId}`

    );


  if (
    workId === undefined ||
    workId === null
  ) {

    statusElement.textContent =
      "ERREUR : ID MANQUANT";

    return;

  }


  statusElement.textContent =
    "ENREGISTREMENT...";


  try {

    const token =
      getToken();


    /*
      Récupération de l'utilisateur
    */

    const userResponse =
      await fetch(

        `${SUPABASE_URL}/auth/v1/user`,

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`

          }

        }

      );


    const user =
      await userResponse.json();


    if (
      !user.id
    ) {

      throw new Error(
        "Session expirée."
      );

    }


    /*
      IMPORTANT :
      Id avec I majuscule.
    */

    const response =
      await fetch(

        `${SUPABASE_URL}/rest/v1/works?Id=eq.${encodeURIComponent(
          workId
        )}`,

        {

          method:
            "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              status:
                newStatus,

              reviewed_at:
                new Date()
                  .toISOString(),

              reviewed_by:
                user.id

            })

        }

      );


    if (
      !response.ok
    ) {

      const error =
        await response.text();


      throw new Error(
        error ||
        "Impossible de modifier l'œuvre."
      );

    }


    await loadPendingWorks();


  } catch (error) {

    console.error(
      error
    );


    statusElement.textContent =

      "ERREUR : " +
      error.message;

  }

}


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    () => {

      localStorage.removeItem(
        "valen_access_token"
      );


      localStorage.removeItem(
        "valen_refresh_token"
      );


      location.reload();

    }
  );


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
) {

  return String(
    value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   EXISTING SESSION
========================= */

if (
  getToken()
) {

  showAdmin();

}

</script>

</body>

</html>
