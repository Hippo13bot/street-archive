<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALEN WORLD — ADMIN</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: #f4f4f0;
  color: #111;

  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}


/* =========================
   LOGIN
========================= */

#loginScreen {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 400px;

  padding: 20px;

  border: 2px solid #111;
}

.logo {
  display: inline-block;

  padding: 5px 7px 4px;

  border: 2px solid #111;

  font-size: 22px;
  font-weight: 900;

  letter-spacing: -1.5px;
}

.admin-label {
  margin-top: 5px;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1.5px;
}

.login-box h1 {
  margin: 20px 0;

  font-size: 28px;
  line-height: 1;

  letter-spacing: -1.5px;
}

label {
  display: block;

  margin: 13px 0 5px;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1px;
}

input {
  width: 100%;

  padding: 11px;

  border: 1px solid #111;
  border-radius: 0;

  background: transparent;
}

.login-button {
  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border: 2px solid #111;

  background: #111;
  color: #f4f4f0;

  font-size: 10px;
  font-weight: 900;

  letter-spacing: 1px;
}

.error {
  margin-top: 10px;

  font-size: 10px;
  font-weight: 900;
}


/* =========================
   ADMIN
========================= */

#adminApp {
  display: none;
}

header {
  padding: 16px;

  border-bottom: 2px solid #111;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;
}

.logout {
  padding: 8px 10px;

  border: 1px solid #111;

  background: transparent;

  font-size: 9px;
  font-weight: 900;
}


/* =========================
   MAIN
========================= */

main {
  width: 100%;
  max-width: 1200px;

  margin: auto;

  padding: 18px 16px 40px;
}

.top {
  display: flex;

  align-items: end;
  justify-content: space-between;

  gap: 10px;

  margin-bottom: 18px;
}

h1 {
  margin: 0;

  font-size: 28px;
  line-height: 1;

  letter-spacing: -1.5px;
}

.counter {
  padding: 6px 8px;

  border: 1px dashed #111;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   MAP
========================= */

#adminMap {
  width: 100%;
  height: 430px;

  margin-bottom: 20px;

  border: 2px solid #111;

  filter: grayscale(1) contrast(.9);
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  border-radius: 0;
  box-shadow: none;
}

.leaflet-popup-content {
  margin: 10px;

  font-family: Arial, Helvetica, sans-serif;
}

.leaflet-control-zoom a {
  border-radius: 0 !important;
}


/* =========================
   WORKS
========================= */

#works {
  display: grid;

  gap: 15px;
}

.work {
  border: 2px solid #111;

  background: #f4f4f0;
}

.photo {
  width: 100%;

  max-height: 500px;

  object-fit: cover;

  display: block;

  border-bottom: 1px solid #111;
}

.info {
  padding: 13px;
}

.category {
  display: inline-block;

  padding: 5px 7px;

  border: 1px dashed #111;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1px;
}

.id {
  margin-top: 8px;

  font-size: 9px;

  font-weight: 900;
}

.date {
  margin-top: 8px;

  font-size: 10px;
  font-weight: 700;
}

.location {
  margin-top: 8px;

  font-size: 9px;

  line-height: 1.5;
}

.coordinates {
  margin-top: 3px;

  font-size: 9px;

  opacity: .6;
}

.actions {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 7px;

  margin-top: 15px;
}

.approve,
.reject {
  padding: 12px;

  border-radius: 0;

  font-size: 10px;
  font-weight: 900;

  letter-spacing: .8px;
}

.approve {
  border: 2px solid #111;

  background: #111;
  color: #f4f4f0;
}

.reject {
  border: 1px solid #111;

  background: transparent;
  color: #111;
}

.status {
  margin-top: 10px;

  font-size: 10px;
  font-weight: 900;
}


/* =========================
   EMPTY
========================= */

.empty {
  padding: 30px 15px;

  border: 1px dashed #111;

  text-align: center;

  font-size: 10px;
  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   POPUP
========================= */

.popup-image {
  width: 180px;

  max-height: 130px;

  object-fit: cover;

  margin-top: 8px;

  filter: grayscale(1);
}

.popup-title {
  font-weight: 900;

  font-size: 12px;
}

.popup-meta {
  margin-top: 5px;

  font-size: 9px;

  line-height: 1.5;
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

  #works {
    grid-template-columns: repeat(2, 1fr);
  }

}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen">

  <div class="login-box">

    <div class="logo">
      VALEN WORLD
    </div>

    <div class="admin-label">
      ADMINISTRATION
    </div>

    <h1>
      CONNEXION
    </h1>

    <form id="loginForm">

      <label>
        EMAIL
      </label>

      <input
        type="email"
        id="email"
        required
        autocomplete="email"
      >

      <label>
        MOT DE PASSE
      </label>

      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
      >

      <button
        type="submit"
        class="login-button"
      >
        SE CONNECTER
      </button>

      <div
        id="loginError"
        class="error"
      ></div>

    </form>

  </div>

</section>



<!-- =====================================================
     ADMIN APP
===================================================== -->

<div id="adminApp">

  <header>

    <div>

      <div class="logo">
        VALEN WORLD
      </div>

      <div class="admin-label">
        ADMINISTRATION
      </div>

    </div>

    <button
      id="logout"
      class="logout"
    >
      DÉCONNEXION
    </button>

  </header>


  <main>

    <div class="top">

      <h1>
        À VALIDER
      </h1>

      <div class="counter">

        <span id="counter">
          0
        </span>

        EN ATTENTE

      </div>

    </div>


    <!-- CARTE ADMIN -->

    <div id="adminMap"></div>


    <!-- LISTE -->

    <div id="works"></div>

  </main>

</div>



<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://klvcugwhjaxmpvskplqd.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_AAzooie5TH6HNzupodCrvQ_nWrY0D_t";


/* =====================================================
   VARIABLES
===================================================== */

let adminMap = null;

let works = [];

let adminMarkers = [];

let currentUser = null;


/*
  IMPORTANT :

  Dans ta base Supabase la colonne s'appelle :

  "Id"

  avec un I MAJUSCULE.

  PostgreSQL distingue "Id" de "id".
*/


/* =====================================================
   TOKEN
===================================================== */

function getToken() {

  return localStorage.getItem(
    "valen_access_token"
  );

}


/* =====================================================
   SUPABASE FETCH
===================================================== */

async function supabaseFetch(
  endpoint,
  options = {}
) {

  const token =
    getToken();


  const headers = {

    "apikey":
      SUPABASE_KEY,

    ...options.headers

  };


  if (token) {

    headers[
      "Authorization"
    ] =
      `Bearer ${token}`;

  }


  return fetch(
    `${SUPABASE_URL}${endpoint}`,
    {
      ...options,
      headers
    }
  );

}


/* =====================================================
   LOGIN
===================================================== */

document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      const error =
        document
          .getElementById(
            "loginError"
          );


      error.textContent =
        "CONNEXION...";


      try {

        const response =
          await fetch(

            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,

            {

              method:
                "POST",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  email:
                    email,

                  password:
                    password

                })

            }

          );


        const data =
          await response.json();


        if (
          !response.ok
        ) {

          throw new Error(

            data.error_description ||
            data.msg ||
            "Connexion impossible."

          );

        }


        localStorage.setItem(
          "valen_access_token",
          data.access_token
        );


        localStorage.setItem(
          "valen_refresh_token",
          data.refresh_token
        );


        currentUser =
          data.user;


        showAdmin();


      } catch (
        err
      ) {

        console.error(
          err
        );

        error.textContent =
          err.message;

      }

    }
  );


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin() {

  document
    .getElementById(
      "loginScreen"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "adminApp"
    )
    .style.display =
    "block";


  /*
    La carte est créée seulement
    maintenant que le conteneur existe.
  */

  setTimeout(
    () => {

      initializeAdminMap();

      loadPendingWorks();

    },
    50
  );

}


/* =====================================================
   MAP INITIALIZATION
===================================================== */

function initializeAdminMap() {

  if (
    adminMap
  ) {

    adminMap.invalidateSize();

    return;

  }


  const mapElement =
    document.getElementById(
      "adminMap"
    );


  if (
    !mapElement
  ) {

    console.error(
      "Conteneur de carte introuvable."
    );

    return;

  }


  adminMap =
    L.map(
      "adminMap",
      {
        zoomControl:
          true
      }
    )
    .setView(
      [48.8566, 2.3522],
      5
    );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      attribution:
        "© OpenStreetMap contributors"

    }

  ).addTo(
    adminMap
  );


  setTimeout(
    () => {

      adminMap.invalidateSize();

    },
    200
  );

}


/* =====================================================
   LOAD PENDING WORKS
===================================================== */

async function loadPendingWorks() {

  const container =
    document.getElementById(
      "works"
    );


  container.innerHTML =
    `
      <div class="empty">
        CHARGEMENT...
      </div>
    `;


  try {

    /*
      IMPORTANT :

      "Id" est écrit entre guillemets
      car la colonne possède un I majuscule.
    */

    const response =
      await supabaseFetch(

        `/rest/v1/works?select=*&status=eq.pending&order="Id".desc`

      );


    const data =
      await response.json();


    if (
      !response.ok
    ) {

      throw new Error(
        JSON.stringify(data)
      );

    }


    works =
      Array.isArray(data)
        ? data
        : [];


    document.getElementById(
      "counter"
    ).textContent =
      works.length;


    renderAdminMarkers();


    renderWorks();


  } catch (
    error
  ) {

    console.error(
      error
    );


    container.innerHTML =
      `
        <div class="empty">

          ERREUR DE CHARGEMENT

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>
      `;

  }

}


/* =====================================================
   RENDER MAP MARKERS
===================================================== */

function renderAdminMarkers() {

  if (
    !adminMap
  ) {

    return;

  }


  adminMarkers.forEach(
    marker => {

      adminMap.removeLayer(
        marker
      );

    }
  );


  adminMarkers = [];


  const validWorks =
    works.filter(
      work => {

        return (
          Number.isFinite(
            Number(
              work.latitude
            )
          ) &&
          Number.isFinite(
            Number(
              work.longitude
            )
          )

        );

      }
    );


  validWorks.forEach(
    work => {

      const latitude =
        Number(
          work.latitude
        );


      const longitude =
        Number(
          work.longitude
        );


      const marker =
        L.circleMarker(

          [
            latitude,
            longitude
          ],

          {

            radius:
              8,

            color:
              "#111",

            weight:
              2,

            dashArray:
              "3,3",

            fillColor:
              "#f4f4f0",

            fillOpacity:
              1

          }

        );


      let popup = `

        <div>

          <div class="popup-title">

            ${escapeHTML(
              (
                work.category ||
                "WORK"
              ).toUpperCase()
            )}

          </div>

          <div class="popup-meta">

            ID :
            ${escapeHTML(
              getWorkId(work)
            )}

          </div>

      `;


      if (
        work.address
      ) {

        popup += `

          <div class="popup-meta">

            ${escapeHTML(
              work.address
            )}

          </div>

        `;

      }


      popup += `

          <div class="popup-meta">

            ${latitude.toFixed(6)}
            ,
            ${longitude.toFixed(6)}

          </div>

        </div>

      `;


      if (
        work.photo_url
      ) {

        popup = `

          <div>

            <div class="popup-title">

              ${escapeHTML(
                (
                  work.category ||
                  "WORK"
                ).toUpperCase()
              )}

            </div>

            <img
              class="popup-image"
              src="${escapeHTML(
                work.photo_url
              )}"
              alt=""
            >

            <div class="popup-meta">

              ID :
              ${escapeHTML(
                getWorkId(work)
              )}

            </div>

            ${
              work.address
                ? `
                  <div class="popup-meta">
                    ${escapeHTML(
                      work.address
                    )}
                  </div>
                `
                : ""
            }

          </div>

        `;

      }


      marker.bindPopup(
        popup
      );


      marker.addTo(
        adminMap
      );


      adminMarkers.push(
        marker
      );

    }
  );


  /*
    Si des œuvres existent,
    on centre la carte dessus.
  */

  if (
    validWorks.length > 0
  ) {

    const bounds =
      L.latLngBounds(
        validWorks.map(
          work => [

            Number(
              work.latitude
            ),

            Number(
              work.longitude
            )

          ]
        )
      );


    adminMap.fitBounds(
      bounds,
      {
        padding:
          [40, 40],
        maxZoom:
          15
      }
    );

  }

}


/* =====================================================
   GET REAL WORK ID
===================================================== */

function getWorkId(
  work
) {

  /*
    Priorité absolue à "Id".
  */

  if (
    work.Id !== undefined &&
    work.Id !== null
  ) {

    return String(
      work.Id
    );

  }


  /*
    Sécurité au cas où Supabase
    renverrait exceptionnellement id.
  */

  if (
    work.id !== undefined &&
    work.id !== null
  ) {

    return String(
      work.id
    );

  }


  return "";

}


/* =====================================================
   RENDER WORK CARDS
===================================================== */

function renderWorks() {

  const container =
    document.getElementById(
      "works"
    );


  if (
    works.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty">

          AUCUNE ŒUVRE EN ATTENTE

        </div>
      `;

    return;

  }


  container.innerHTML =
    "";


  works.forEach(
    work => {

      container.appendChild(
        createWorkCard(
          work
        )
      );

    }
  );

}


/* =====================================================
   CREATE CARD
===================================================== */

function createWorkCard(
  work
) {

  const article =
    document.createElement(
      "article"
    );


  article.className =
    "work";


  const workId =
    getWorkId(
      work
    );


  let photoHTML =
    "";


  if (
    work.photo_url
  ) {

    photoHTML = `

      <img
        class="photo"
        src="${escapeHTML(
          work.photo_url
        )}"
        alt="Œuvre"
      >

    `;

  }


  const latitude =
    Number(
      work.latitude
    );


  const longitude =
    Number(
      work.longitude
    );


  let coordinates =
    "NON RENSEIGNÉES";


  if (
    Number.isFinite(latitude) &&
    Number.isFinite(longitude)
  ) {

    coordinates =

      latitude.toFixed(6) +
      " , " +
      longitude.toFixed(6);

  }


  article.innerHTML = `

    ${photoHTML}

    <div class="info">

      <div class="category">

        ${escapeHTML(
          (
            work.category ||
            "WORK"
          ).toUpperCase()
        )}

      </div>


      <div class="id">

        ID :
        ${escapeHTML(
          workId || "—"
        )}

      </div>


      <div class="date">

        DATE :
        ${escapeHTML(
          work.date ||
          "—"
        )}

      </div>


      <div class="location">

        ${
          work.address
            ? `
              ADRESSE :
              ${escapeHTML(
                work.address
              )}
            `
            : `
              ADRESSE :
              NON RENSEIGNÉE
            `
        }

      </div>


      <div class="coordinates">

        COORDONNÉES :
        ${escapeHTML(
          coordinates
        )}

      </div>


      <div class="actions">

        <button
          class="approve"
          type="button"
        >
          ✓ APPROUVER
        </button>


        <button
          class="reject"
          type="button"
        >
          ✕ REFUSER
        </button>

      </div>


      <div
        class="status"
      ></div>

    </div>

  `;


  const approveButton =
    article.querySelector(
      ".approve"
    );


  const rejectButton =
    article.querySelector(
      ".reject"
    );


  const statusElement =
    article.querySelector(
      ".status"
    );


  approveButton.addEventListener(
    "click",
    () => {

      moderateWork(
        workId,
        "approved",
        statusElement
      );

    }
  );


  rejectButton.addEventListener(
    "click",
    () => {

      moderateWork(
        workId,
        "rejected",
        statusElement
      );

    }
  );


  return article;

}


/* =====================================================
   MODERATION
===================================================== */

async function moderateWork(
  workId,
  newStatus,
  statusElement
) {

  if (
    !workId
  ) {

    statusElement.textContent =
      "ERREUR : ID MANQUANT.";

    return;

  }


  statusElement.textContent =
    "ENREGISTREMENT...";


  try {

    const token =
      getToken();


    if (
      !token
    ) {

      throw new Error(
        "Session expirée."
      );

    }


    /*
      On récupère le compte connecté.
    */

    const userResponse =
      await supabaseFetch(
        "/auth/v1/user"
      );


    const user =
      await userResponse.json();


    if (
      !user.id
    ) {

      throw new Error(
        "Utilisateur non connecté."
      );

    }


    /*
      IMPORTANT :

      Le filtre utilise "Id"
      et non id.

      C'est la correction principale
      de ton erreur 42703.
    */

    const endpoint =

      `/rest/v1/works?Id=eq.${encodeURIComponent(
        workId
      )}`;


    const response =
      await supabaseFetch(
        endpoint,
        {

          method:
            "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify({

              status:
                newStatus,

              reviewed_at:
                new Date().toISOString(),

              reviewed_by:
                user.id

            })

        }
      );


    const responseText =
      await response.text();


    if (
      !response.ok
    ) {

      throw new Error(
        responseText ||
        "Modification impossible."
      );

    }


    /*
      L'œuvre a bien été modifiée.
      On recharge complètement la liste.
    */

    await loadPendingWorks();


  } catch (
    error
  ) {

    console.error(
      error
    );


    statusElement.textContent =
      "ERREUR : " +
      error.message;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

document
  .getElementById(
    "logout"
  )
  .addEventListener(
    "click",
    () => {

      localStorage.removeItem(
        "valen_access_token"
      );


      localStorage.removeItem(
        "valen_refresh_token"
      );


      location.reload();

    }
  );


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   EXISTING SESSION
===================================================== */

if (
  getToken()
) {

  showAdmin();

}

</script>

</body>
</html>
