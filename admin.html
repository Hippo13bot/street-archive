<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>VALEN WORLD — ADMIN</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: #f4f4f0;
  color: #111;

  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}


/* =========================
   LOGIN
========================= */

#loginScreen {

  min-height: 100vh;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

.login-box {

  width: 100%;
  max-width: 400px;

  padding: 20px;

  border: 2px solid #111;
}

.logo {

  display: inline-block;

  padding: 5px 7px 4px;

  border: 2px solid #111;

  font-size: 22px;

  font-weight: 900;

  letter-spacing: -1.5px;
}

.admin-label {

  margin-top: 5px;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1.5px;
}

.login-box h1 {

  margin: 20px 0;

  font-size: 28px;

  letter-spacing: -1.5px;
}

label {

  display: block;

  margin: 13px 0 5px;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

input,
select {

  width: 100%;

  padding: 11px;

  border: 1px solid #111;

  border-radius: 0;

  background: transparent;
}

.login-button {

  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border: 2px solid #111;

  background: #111;

  color: #f4f4f0;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 1px;
}

.error {

  margin-top: 10px;

  font-size: 10px;

  font-weight: 900;
}


/* =========================
   ADMIN HEADER
========================= */

header {

  position: sticky;

  top: 0;

  z-index: 2000;

  padding: 12px 16px;

  border-bottom: 2px solid #111;

  background: #f4f4f0;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;
}

.logout {

  padding: 8px 10px;

  border: 1px solid #111;

  border-radius: 0;

  background: transparent;

  font-size: 9px;

  font-weight: 900;
}


/* =========================
   MAIN
========================= */

main {

  width: 100%;

  max-width: 1200px;

  margin: auto;

  padding: 16px;
}


/* =========================
   TOP
========================= */

.top {

  display: flex;

  align-items: end;

  justify-content: space-between;

  gap: 10px;

  margin-bottom: 15px;
}

h1 {

  margin: 0;

  font-size: 28px;

  line-height: 1;

  letter-spacing: -1.5px;
}

.counter {

  padding: 6px 8px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   MAP
========================= */

.map-wrapper {

  position: relative;

  width: 100%;

  height: 420px;

  margin-bottom: 18px;

  border: 2px solid #111;
}

#adminMap {

  width: 100%;

  height: 100%;

  filter: grayscale(1) contrast(.9);
}

.map-help {

  position: absolute;

  top: 10px;

  left: 10px;

  z-index: 1000;

  padding: 7px 9px;

  border: 1px dashed #111;

  background: #f4f4f0;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: .8px;
}


/* =========================
   FILTER
========================= */

.filters {

  display: flex;

  gap: 5px;

  overflow-x: auto;

  margin-bottom: 15px;
}

.filter {

  flex-shrink: 0;

  padding: 8px 10px;

  border: 1px solid #111;

  background: transparent;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

.filter.active {

  background: #111;

  color: #f4f4f0;
}


/* =========================
   WORKS
========================= */

#works {

  display: grid;

  gap: 15px;
}

.work {

  border: 2px solid #111;

  background: #f4f4f0;
}

.photo {

  width: 100%;

  max-height: 400px;

  object-fit: cover;

  display: block;

  border-bottom: 1px solid #111;
}

.info {

  padding: 13px;
}

.category {

  display: inline-block;

  padding: 5px 7px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

.row {

  margin-top: 8px;

  font-size: 10px;

  line-height: 1.4;
}

.row strong {

  font-size: 8px;

  letter-spacing: 1px;
}

.address {

  margin-top: 10px;

  padding: 8px;

  border: 1px dashed #111;

  font-size: 10px;

  line-height: 1.4;
}

.coordinates {

  margin-top: 5px;

  font-size: 8px;

  opacity: .65;
}


/* =========================
   STATUS
========================= */

.pending {

  margin-top: 10px;

  padding: 7px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   ACTIONS
========================= */

.actions {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 7px;

  margin-top: 15px;
}

.action {

  padding: 12px;

  border-radius: 0;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: .8px;
}

.approve {

  border: 2px solid #111;

  background: #111;

  color: #f4f4f0;
}

.reject {

  border: 1px solid #111;

  background: transparent;
}

.edit {

  grid-column: 1 / -1;

  border: 1px solid #111;

  background: transparent;
}


/* =========================
   EMPTY
========================= */

.empty {

  padding: 30px 15px;

  border: 1px dashed #111;

  text-align: center;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   EDIT PANEL
========================= */

.edit-panel {

  display: none;

  margin-top: 12px;

  padding: 12px;

  border-top: 1px solid #111;
}

.edit-panel.open {

  display: block;
}

.edit-location {

  margin-top: 8px;

  padding: 9px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 700;

  line-height: 1.4;
}

.location-buttons {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 6px;

  margin-top: 7px;
}

.small-button {

  padding: 9px 6px;

  border: 1px solid #111;

  background: transparent;

  font-size: 8px;

  font-weight: 900;
}

.save-button {

  width: 100%;

  margin-top: 10px;

  padding: 11px;

  border: 2px solid #111;

  background: #111;

  color: #f4f4f0;

  font-size: 9px;

  font-weight: 900;
}

.cancel-button {

  width: 100%;

  margin-top: 6px;

  padding: 9px;

  border: 1px solid #111;

  background: transparent;

  font-size: 9px;

  font-weight: 900;
}

.edit-status {

  margin-top: 8px;

  font-size: 9px;

  font-weight: 900;
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

  #works {

    grid-template-columns:
      repeat(2, 1fr);

  }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

  <div class="login-box">

    <div class="logo">
      VALEN WORLD
    </div>

    <div class="admin-label">
      ADMINISTRATION
    </div>

    <h1>
      CONNEXION
    </h1>

    <form id="loginForm">

      <label>
        EMAIL
      </label>

      <input
        type="email"
        id="email"
        required
        autocomplete="email"
      >

      <label>
        MOT DE PASSE
      </label>

      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
      >

      <button
        type="submit"
        class="login-button"
      >
        SE CONNECTER
      </button>

      <div
        class="error"
        id="loginError"
      ></div>

    </form>

  </div>

</section>


<!-- =========================
     ADMIN
========================= -->

<div
  id="adminApp"
  style="display:none;"
>


<header>

  <div>

    <div class="logo">
      VALEN WORLD
    </div>

    <div class="admin-label">
      ADMINISTRATION
    </div>

  </div>

  <button
    class="logout"
    id="logout"
  >
    DÉCONNEXION
  </button>

</header>


<main>


  <div class="top">

    <h1>
      ŒUVRES
    </h1>

    <div class="counter">

      <span id="counter">
        0
      </span>

      EN ATTENTE

    </div>

  </div>


  <!-- MAP -->

  <div class="map-wrapper">

    <div id="adminMap"></div>

    <div class="map-help">

      CLIQUE SUR UNE ŒUVRE POUR L'ÉDITER

    </div>

  </div>


  <!-- FILTERS -->

  <div class="filters">

    <button
      class="filter active"
      data-filter="pending"
    >
      EN ATTENTE
    </button>

    <button
      class="filter"
      data-filter="approved"
    >
      APPROUVÉES
    </button>

    <button
      class="filter"
      data-filter="rejected"
    >
      REFUSÉES
    </button>

    <button
      class="filter"
      data-filter="all"
    >
      TOUTES
    </button>

  </div>


  <div id="works"></div>


</main>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://klvcugwhjaxmpvskplqd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AAzooie5TH6HNzupodCrvQ_nWrY0D_t";


/* =========================================================
   VARIABLES
========================================================= */

let currentFilter =
  "pending";

let works =
  [];

let mapMarkers =
  [];

let editingId =
  null;

let editMarker =
  null;


/* =========================================================
   MAP
========================================================= */

const adminMap =
  L.map(
    "adminMap",
    {
      zoomControl: true
    }
  ).setView(
    [48.8566, 2.3522],
    5
  );


L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    attribution:
      "© OpenStreetMap contributors"

  }

).addTo(
  adminMap
);


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

  return localStorage.getItem(
    "valen_access_token"
  );

}


/* =========================================================
   API
========================================================= */

async function api(
  url,
  options = {}
) {

  const token =
    getToken();


  const response =
    await fetch(

      SUPABASE_URL + url,

      {

        ...options,

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${token}`,

          ...(options.headers || {})

        }

      }

    );


  return response;

}


/* =========================================================
   LOGIN
========================================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const error =
        document
          .getElementById("loginError");


      error.textContent =
        "CONNEXION...";


      try {

        const response =
          await fetch(

            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,

            {

              method:
                "POST",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  email,
                  password

                })

            }

          );


        const data =
          await response.json();


        if (
          !response.ok
        ) {

          throw new Error(

            data.error_description ||
            data.msg ||
            "Connexion impossible."

          );

        }


        localStorage.setItem(

          "valen_access_token",

          data.access_token

        );


        localStorage.setItem(

          "valen_refresh_token",

          data.refresh_token

        );


        showAdmin();


      } catch (err) {

        error.textContent =
          err.message;

      }

    }
  );


/* =========================================================
   SHOW ADMIN
========================================================= */

function showAdmin() {

  document
    .getElementById("loginScreen")
    .style.display =
    "none";


  document
    .getElementById("adminApp")
    .style.display =
    "block";


  setTimeout(
    () => adminMap.invalidateSize(),
    200
  );


  loadWorks();

}


/* =========================================================
   LOAD ALL WORKS
========================================================= */

async function loadWorks() {

  const container =
    document.getElementById(
      "works"
    );


  container.innerHTML =
    `<div class="empty">CHARGEMENT...</div>`;


  try {

    const response =
      await api(

        "/rest/v1/works?select=*&order=Id.desc"

      );


    const data =
      await response.json();


    if (
      !response.ok
    ) {

      throw new Error(

        data.message ||
        "Impossible de charger les œuvres."

      );

    }


    works =
      data;


    renderWorks();

    renderMap();


  } catch (error) {

    console.error(error);


    container.innerHTML = `

      <div class="empty">

        ERREUR :
        ${escapeHTML(error.message)}

      </div>

    `;

  }

}


/* =========================================================
   FILTER
========================================================= */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".filter")
          .forEach(
            b =>
              b.classList.remove("active")
          );


        button.classList.add(
          "active"
        );


        currentFilter =
          button.dataset.filter;


        renderWorks();

        renderMap();

      }
    );

  });


/* =========================================================
   FILTERED WORKS
========================================================= */

function getFilteredWorks() {

  if (
    currentFilter === "all"
  ) {

    return works;

  }


  return works.filter(

    work =>
      work.status ===
      currentFilter

  );

}


/* =========================================================
   RENDER MAP
========================================================= */

function renderMap() {

  mapMarkers.forEach(
    marker =>
      adminMap.removeLayer(
        marker
      )
  );


  mapMarkers = [];


  const visibleWorks =
    getFilteredWorks();


  visibleWorks.forEach(
    work => {

      if (
        work.latitude === null ||
        work.longitude === null
      ) {

        return;

      }


      const marker =
        L.circleMarker(

          [
            Number(work.latitude),
            Number(work.longitude)
          ],

          {

            radius:
              work.status === "pending"
                ? 9
                : 7,

            color:
              "#111",

            weight:
              2,

            dashArray:
              work.status === "pending"
                ? "4,3"
                : null,

            fillColor:
              "#f4f4f0",

            fillOpacity:
              1

          }

        ).addTo(
          adminMap
        );


      marker.bindPopup(

        `

        <div style="min-width:180px">

          <strong>

            ${(work.category || "WORK").toUpperCase()}

            #${work.Id}

          </strong>

          <br>

          <small>

            ${escapeHTML(
              work.status || ""
            )}

          </small>

          <br><br>

          <button
            onclick="openEditFromMap(${work.Id})"
            style="
              width:100%;
              padding:8px;
              border:1px solid #111;
              background:#111;
              color:white;
              font-weight:900;
            "
          >

            MODIFIER

          </button>

        </div>

        `

      );


      marker.on(
        "click",
        () => {

          openEditFromMap(
            work.Id
          );

        }
      );


      mapMarkers.push(
        marker
      );

    }
  );

}


/* =========================================================
   RENDER CARDS
========================================================= */

function renderWorks() {

  const container =
    document.getElementById(
      "works"
    );


  const visibleWorks =
    getFilteredWorks();


  const pendingCount =
    works.filter(
      work =>
        work.status ===
        "pending"
    ).length;


  document.getElementById(
    "counter"
  ).textContent =
    pendingCount;


  if (
    visibleWorks.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        AUCUNE ŒUVRE

      </div>

    `;

    return;

  }


  container.innerHTML =
    "";


  visibleWorks.forEach(
    work => {

      container.appendChild(
        createCard(work)
      );

    }
  );

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(work) {

  const article =
    document.createElement(
      "article"
    );


  article.className =
    "work";


  const image =
    work.photo_url

      ? `

        <img
          class="photo"
          src="${escapeHTML(work.photo_url)}"
          alt="Œuvre"
        >

      `

      : "";


  article.innerHTML = `

    ${image}

    <div class="info">

      <div class="category">

        ${escapeHTML(
          (work.category || "WORK")
            .toUpperCase()
        )}

      </div>


      <div class="row">

        <strong>DATE</strong><br>

        ${escapeHTML(
          work.date || "—"
        )}

      </div>


      <div class="address">

        <strong>ADRESSE</strong><br>

        <span id="address-${work.Id}">

          RECHERCHE DE L'ADRESSE...

        </span>

      </div>


      <div class="coordinates">

        LAT :
        ${Number(work.latitude).toFixed(6)}

        —

        LNG :
        ${Number(work.longitude).toFixed(6)}

      </div>


      <div class="pending">

        STATUT :
        ${(work.status || "").toUpperCase()}

      </div>


      <div class="actions">

        ${
          work.status === "pending"

          ? `

            <button
              class="action approve"
              data-approve="${work.Id}"
            >

              ✓ APPROUVER

            </button>

            <button
              class="action reject"
              data-reject="${work.Id}"
            >

              ✕ REFUSER

            </button>

          `

          : `

            <button
              class="action edit"
              data-edit="${work.Id}"
            >

              MODIFIER L'ŒUVRE

            </button>

          `
        }

        ${
          work.status === "pending"

          ? `

            <button
              class="action edit"
              data-edit="${work.Id}"
            >

              MODIFIER AVANT VALIDATION

            </button>

          `

          : ""

        }

      </div>


      <div
        class="edit-panel"
        id="edit-${work.Id}"
      >

        <label>
          CATÉGORIE
        </label>

        <select
          id="category-${work.Id}"
        >

          <option
            value="sticker"
            ${work.category === "sticker" ? "selected" : ""}
          >
            STICKER
          </option>

          <option
            value="tag"
            ${work.category === "tag" ? "selected" : ""}
          >
            TAG
          </option>

          <option
            value="graff"
            ${work.category === "graff" ? "selected" : ""}
          >
            GRAFF
          </option>

        </select>


        <label>
          DATE
        </label>

        <input
          type="date"
          id="date-${work.Id}"
          value="${escapeHTML(work.date || "")}"
        >


        <label>
          ADRESSE
        </label>

        <input
          type="text"
          id="address-edit-${work.Id}"
          placeholder="Adresse"
        >


        <div class="location-buttons">

          <button
            type="button"
            class="small-button"
            onclick="findAddress(${work.Id})"
          >

            RECHERCHER

          </button>

          <button
            type="button"
            class="small-button"
            onclick="useCurrentLocation(${work.Id})"
          >

            MA POSITION

          </button>

        </div>


        <div
          class="edit-location"
          id="edit-location-${work.Id}"
        >

          Clique sur la carte pour déplacer le point.

        </div>


        <label>
          NOUVELLE PHOTO
        </label>

        <input
          type="file"
          id="photo-${work.Id}"
          accept="image/*"
        >


        <button
          class="save-button"
          onclick="saveWork(${work.Id})"
        >

          ENREGISTRER LES MODIFICATIONS

        </button>


        <button
          class="cancel-button"
          onclick="closeEdit(${work.Id})"
        >

          ANNULER

        </button>


        <div
          class="edit-status"
          id="edit-status-${work.Id}"
        ></div>

      </div>

    </div>

  `;


  /* Bouton approbation */

  const approve =
    article.querySelector(
      "[data-approve]"
    );


  if (approve) {

    approve.onclick =
      () =>
        moderateWork(
          work.Id,
          "approved"
        );

  }


  /* Bouton refus */

  const reject =
    article.querySelector(
      "[data-reject]"
    );


  if (reject) {

    reject.onclick =
      () =>
        moderateWork(
          work.Id,
          "rejected"
        );

  }


  /* Bouton édition */

  const edit =
    article.querySelector(
      "[data-edit]"
    );


  if (edit) {

    edit.onclick =
      () =>
        openEdit(
          work.Id
        );

  }


  /* Adresse automatique */

  reverseGeocode(
    work.latitude,
    work.longitude
  ).then(
    address => {

      const element =
        document.getElementById(
          `address-${work.Id}`
        );


      if (element) {

        element.textContent =
          address;

      }

    }
  );


  return article;

}


/* =========================================================
   OPEN EDIT
========================================================= */

function openEdit(id) {

  const panel =
    document.getElementById(
      `edit-${id}`
    );


  if (!panel) {
    return;
  }


  panel.classList.add(
    "open"
  );


  editingId =
    id;


  const work =
    works.find(
      w =>
        Number(w.Id) ===
        Number(id)
    );


  if (!work) {
    return;
  }


  document.getElementById(
    `address-edit-${id}`
  ).value =
    "";


  reverseGeocode(
    work.latitude,
    work.longitude
  ).then(
    address => {

      document.getElementById(
        `address-edit-${id}`
      ).value =
        address;

    }
  );


  adminMap.setView(
    [
      Number(work.latitude),
      Number(work.longitude)
    ],
    17
  );

}


/* =========================================================
   OPEN EDIT FROM MAP
========================================================= */

function openEditFromMap(id) {

  const work =
    works.find(
      w =>
        Number(w.Id) ===
        Number(id)
    );


  if (!work) {
    return;
  }


  openEdit(id);


  setTimeout(
    () => {

      const element =
        document.getElementById(
          `edit-${id}`
        );


      if (element) {

        element.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      }

    },
    100
  );

}


/* =========================================================
   CLOSE EDIT
========================================================= */

function closeEdit(id) {

  const panel =
    document.getElementById(
      `edit-${id}`
    );


  if (panel) {

    panel.classList.remove(
      "open"
    );

  }


  if (editMarker) {

    adminMap.removeLayer(
      editMarker
    );

    editMarker =
      null;

  }


  editingId =
    null;

}


/* =========================================================
   MAP CLICK FOR EDITING
========================================================= */

adminMap.on(
  "click",
  event => {

    if (
      editingId === null
    ) {

      return;

    }


    const latitude =
      event.latlng.lat;


    const longitude =
      event.latlng.lng;


    if (editMarker) {

      adminMap.removeLayer(
        editMarker
      );

    }


    editMarker =
      L.circleMarker(

        [
          latitude,
          longitude
        ],

        {

          radius: 10,

          color: "#111",

          weight: 2,

          dashArray: "4,3",

          fillColor: "#f4f4f0",

          fillOpacity: 1

        }

      ).addTo(
        adminMap
      );


    const info =
      document.getElementById(
        `edit-location-${editingId}`
      );


    if (info) {

      info.textContent =

        `NOUVELLE POSITION : ` +
        latitude.toFixed(6) +
        " , " +
        longitude.toFixed(6);

    }


    const work =
      works.find(
        w =>
          Number(w.Id) ===
          Number(editingId)
      );


    if (work) {

      work._newLatitude =
        latitude;

      work._newLongitude =
        longitude;

    }

  }
);


/* =========================================================
   ADDRESS SEARCH
========================================================= */

async function findAddress(id) {

  const input =
    document.getElementById(
      `address-edit-${id}`
    );


  const address =
    input.value.trim();


  if (!address) {

    alert(
      "Entre une adresse."
    );

    return;

  }


  try {

    const response =
      await fetch(

        "https://nominatim.openstreetmap.org/search?" +

        new URLSearchParams({

          q: address,

          format: "json",

          limit: "1"

        }),

        {

          headers: {

            "Accept-Language":
              "fr"

          }

        }

      );


    const results =
      await response.json();


    if (
      !results.length
    ) {

      throw new Error(
        "Adresse introuvable."
      );

    }


    const latitude =
      Number(
        results[0].lat
      );


    const longitude =
      Number(
        results[0].lon
      );


    const work =
      works.find(
        w =>
          Number(w.Id) ===
          Number(id)
      );


    if (work) {

      work._newLatitude =
        latitude;

      work._newLongitude =
        longitude;

    }


    if (editMarker) {

      adminMap.removeLayer(
        editMarker
      );

    }


    editMarker =
      L.circleMarker(

        [
          latitude,
          longitude
        ],

        {

          radius: 10,

          color: "#111",

          weight: 2,

          dashArray: "4,3",

          fillColor: "#f4f4f0",

          fillOpacity: 1

        }

      ).addTo(
        adminMap
      );


    adminMap.setView(
      [
        latitude,
        longitude
      ],
      17
    );


    document.getElementById(
      `edit-location-${id}`
    ).textContent =

      results[0].display_name;


  } catch (error) {

    alert(
      error.message
    );

  }

}


/* =========================================================
   CURRENT LOCATION
========================================================= */

function useCurrentLocation(id) {

  if (
    !navigator.geolocation
  ) {

    alert(
      "Géolocalisation indisponible."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      const work =
        works.find(
          w =>
            Number(w.Id) ===
            Number(id)
        );


      if (work) {

        work._newLatitude =
          latitude;

        work._newLongitude =
          longitude;

      }


      if (editMarker) {

        adminMap.removeLayer(
          editMarker
        );

      }


      editMarker =
        L.circleMarker(

          [
            latitude,
            longitude
          ],

          {

            radius: 10,

            color: "#111",

            weight: 2,

            dashArray: "4,3",

            fillColor: "#f4f4f0",

            fillOpacity: 1

          }

        ).addTo(
          adminMap
        );


      adminMap.setView(
        [
          latitude,
          longitude
        ],
        17
      );


      document.getElementById(
        `edit-location-${id}`
      ).textContent =
        "POSITION ACTUELLE SÉLECTIONNÉE";

    },

    () => {

      alert(
        "Impossible d'obtenir la position."
      );

    }

  );

}


/* =========================================================
   SAVE WORK
========================================================= */

async function saveWork(id) {

  const work =
    works.find(
      w =>
        Number(w.Id) ===
        Number(id)
    );


  if (!work) {

    return;

  }


  const status =
    document.getElementById(
      `edit-status-${id}`
    );


  status.textContent =
    "ENREGISTREMENT...";


  try {

    const category =
      document.getElementById(
        `category-${id}`
      ).value;


    const date =
      document.getElementById(
        `date-${id}`
      ).value;


    let latitude =
      work._newLatitude ??
      Number(work.latitude);


    let longitude =
      work._newLongitude ??
      Number(work.longitude);


    let photoUrl =
      work.photo_url;


    /* =====================
       PHOTO
    ===================== */

    const file =
      document.getElementById(
        `photo-${id}`
      ).files[0];


    if (file) {

      const filename =
        `${Date.now()}-${file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          ""
        )}`;


      const uploadResponse =
        await api(

          `/storage/v1/object/works/${filename}`,

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                file.type

            },

            body:
              file

          }

        );


      if (
        !uploadResponse.ok
      ) {

        throw new Error(
          "Impossible d'envoyer la nouvelle photo."
        );

      }


      photoUrl =
        `${SUPABASE_URL}/storage/v1/object/public/works/${filename}`;

    }


    /* =====================
       PATCH
    ===================== */

    const payload = {

      category:
        category,

      date:
        date,

      latitude:
        latitude,

      longitude:
        longitude,

      photo_url:
        photoUrl

    };


    const response =
      await api(

        `/rest/v1/works?Id=eq.${encodeURIComponent(id)}`,

        {

          method:
            "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    if (
      !response.ok
    ) {

      const errorText =
        await response.text();


      throw new Error(
        errorText
      );

    }


    status.textContent =
      "✓ MODIFICATIONS ENREGISTRÉES";


    await loadWorks();


    editingId =
      null;


    if (editMarker) {

      adminMap.removeLayer(
        editMarker
      );

      editMarker =
        null;

    }


  } catch (error) {

    console.error(error);


    status.textContent =
      "ERREUR : " +
      error.message;

  }

}


/* =========================================================
   MODERATION
========================================================= */

async function moderateWork(
  id,
  newStatus
) {

  const confirmation =
    newStatus === "approved"

      ? confirm(
          "APPROUVER CETTE ŒUVRE ?"
        )

      : confirm(
          "REFUSER CETTE ŒUVRE ?"
        );


  if (!confirmation) {

    return;

  }


  try {

    const userResponse =
      await api(
        "/auth/v1/user"
      );


    const user =
      await userResponse.json();


    if (
      !user.id
    ) {

      throw new Error(
        "Session expirée."
      );

    }


    const payload = {

      status:
        newStatus,

      reviewed_at:
        new Date().toISOString(),

      reviewed_by:
        user.id

    };


    const response =
      await api(

        `/rest/v1/works?Id=eq.${encodeURIComponent(id)}`,

        {

          method:
            "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    if (
      !response.ok
    ) {

      const errorText =
        await response.text();


      throw new Error(
        errorText
      );

    }


    await loadWorks();


  } catch (error) {

    console.error(error);


    alert(
      "ERREUR : " +
      error.message
    );

  }

}


/* =========================================================
   REVERSE GEOCODING
========================================================= */

async function reverseGeocode(
  latitude,
  longitude
) {

  if (
    latitude === null ||
    longitude === null ||
    latitude === undefined ||
    longitude === undefined
  ) {

    return "LOCALISATION INCONNUE";

  }


  try {

    const response =
      await fetch(

        "https://nominatim.openstreetmap.org/reverse?" +

        new URLSearchParams({

          lat:
            latitude,

          lon:
            longitude,

          format:
            "json",

          "accept-language":
            "fr"

        }),

        {

          headers: {

            "Accept-Language":
              "fr"

          }

        }

      );


    const data =
      await response.json();


    return (

      data.display_name ||

      "ADRESSE INCONNUE"

    );

  } catch {

    return "ADRESSE INDISPONIBLE";

  }

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
