<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALEN WORLD — ADMIN</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: #f4f4f0;
  color: #111;

  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}


/* =========================
   LOGIN
========================= */

#loginScreen {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 400px;

  padding: 20px;

  border: 2px solid #111;
}

.logo {
  display: inline-block;

  padding: 5px 7px 4px;

  border: 2px solid #111;

  font-size: 22px;
  font-weight: 900;

  letter-spacing: -1.5px;
}

.admin-label {
  margin-top: 5px;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1.5px;
}

.login-box h1 {
  margin: 22px 0;

  font-size: 28px;

  letter-spacing: -1.5px;
}

label {
  display: block;

  margin: 13px 0 5px;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1px;
}

input {
  width: 100%;

  padding: 11px;

  border: 1px solid #111;
  border-radius: 0;

  background: transparent;
}

.login-button {
  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border: 2px solid #111;

  background: #111;
  color: #f4f4f0;

  font-size: 10px;
  font-weight: 900;

  letter-spacing: 1px;
}

.error {
  margin-top: 10px;

  font-size: 10px;
  font-weight: 900;
}


/* =========================
   ADMIN
========================= */

#adminApp {
  display: none;
}

header {
  padding: 16px;

  border-bottom: 2px solid #111;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;
}

.logout {
  padding: 8px 10px;

  border: 1px solid #111;

  background: transparent;

  font-size: 9px;
  font-weight: 900;
}

main {
  width: 100%;
  max-width: 1100px;

  margin: auto;

  padding: 18px 16px 50px;
}

.top {
  display: flex;

  align-items: end;
  justify-content: space-between;

  gap: 10px;

  margin-bottom: 18px;
}

h1 {
  margin: 0;

  font-size: 28px;

  line-height: 1;

  letter-spacing: -1.5px;
}

.counter {
  padding: 6px 8px;

  border: 1px dashed #111;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   WORKS
========================= */

#works {
  display: grid;

  gap: 18px;
}

.work {
  border: 2px solid #111;

  background: #f4f4f0;
}

.photo {
  width: 100%;

  max-height: 500px;

  object-fit: cover;

  display: block;

  border-bottom: 1px solid #111;
}

.info {
  padding: 13px;
}

.category {
  display: inline-block;

  padding: 5px 7px;

  border: 1px dashed #111;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1px;
}

.date {
  margin-top: 9px;

  font-size: 10px;
  font-weight: 900;
}

.coordinates {
  margin-top: 6px;

  font-size: 9px;

  opacity: .7;
}

.address {
  margin-top: 8px;

  padding: 8px;

  border: 1px dashed #111;

  font-size: 10px;

  font-weight: 700;

  line-height: 1.35;
}


/* =========================
   MAP
========================= */

.admin-map {
  width: 100%;

  height: 300px;

  margin-top: 13px;

  border: 2px solid #111;

  background: #ddd;
}

.map-help {
  margin-top: 5px;

  font-size: 8px;

  font-weight: 900;

  letter-spacing: .7px;
}


/* =========================
   ACTIONS
========================= */

.actions {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 7px;

  margin-top: 15px;
}

.approve,
.reject {
  padding: 12px;

  border-radius: 0;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: .8px;
}

.approve {
  border: 2px solid #111;

  background: #111;

  color: #f4f4f0;
}

.reject {
  border: 1px solid #111;

  background: transparent;

  color: #111;
}

.status {
  margin-top: 10px;

  font-size: 10px;

  font-weight: 900;
}


/* =========================
   EMPTY
========================= */

.empty {
  padding: 30px 15px;

  border: 1px dashed #111;

  text-align: center;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .admin-map {
    height: 260px;
  }

}


/* =========================
   DESKTOP
========================= */

@media (min-width: 750px) {

  #works {
    grid-template-columns: repeat(2, 1fr);
  }

}

</style>
</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

  <div class="login-box">

    <div class="logo">
      VALEN WORLD
    </div>

    <div class="admin-label">
      ADMINISTRATION
    </div>

    <h1>
      CONNEXION
    </h1>

    <form id="loginForm">

      <label>
        EMAIL
      </label>

      <input
        type="email"
        id="email"
        autocomplete="email"
        required
      >

      <label>
        MOT DE PASSE
      </label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        class="login-button"
      >
        SE CONNECTER
      </button>

      <div
        id="loginError"
        class="error"
      ></div>

    </form>

  </div>

</section>



<!-- =========================
     ADMIN
========================= -->

<div id="adminApp">

  <header>

    <div>

      <div class="logo">
        VALEN WORLD
      </div>

      <div class="admin-label">
        ADMINISTRATION
      </div>

    </div>

    <button
      id="logout"
      class="logout"
    >
      DÉCONNEXION
    </button>

  </header>


  <main>

    <div class="top">

      <h1>
        À VALIDER
      </h1>

      <div class="counter">

        <span id="counter">
          0
        </span>

        EN ATTENTE

      </div>

    </div>


    <div id="works"></div>

  </main>

</div>



<!-- LEAFLET -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const SUPABASE_URL =
  "https://klvcugwhjaxmpvskplqd.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsdmN1Z3doamF4bXB2c2twbHFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODQzNTMsImV4cCI6MjEwMjY2MDM1M30.pEvX_uzDvUMTaZbeCWE071718XGGm0YAj6FgZaB6gVE";


/* =========================================================
   AUTH
========================================================= */

function getToken() {

  return localStorage.getItem(
    "valen_access_token"
  );

}


/* =========================================================
   SUPABASE AUTH LOGIN
========================================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const error =
        document
          .getElementById("loginError");

      error.textContent =
        "CONNEXION...";


      try {

        const response =
          await fetch(
            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
            {

              method: "POST",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  email,
                  password

                })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error_description ||
            data.msg ||
            "Connexion impossible."
          );

        }


        localStorage.setItem(
          "valen_access_token",
          data.access_token
        );

        localStorage.setItem(
          "valen_refresh_token",
          data.refresh_token
        );


        showAdmin();

      } catch (error) {

        error =
          error;

        document
          .getElementById(
            "loginError"
          )
          .textContent =
          error.message;

      }

    }
  );


/* =========================================================
   SHOW ADMIN
========================================================= */

function showAdmin() {

  document
    .getElementById("loginScreen")
    .style.display =
    "none";

  document
    .getElementById("adminApp")
    .style.display =
    "block";

  loadPendingWorks();

}


/* =========================================================
   LOAD PENDING WORKS
========================================================= */

async function loadPendingWorks() {

  const container =
    document.getElementById(
      "works"
    );

  container.innerHTML =
    `
      <div class="empty">
        CHARGEMENT...
      </div>
    `;


  try {

    const token =
      getToken();


    if (!token) {

      throw new Error(
        "Session absente."
      );

    }


    /*
      IMPORTANT :
      La colonne de ta table est "Id"
      avec un I majuscule.
    */

    const url =
      `${SUPABASE_URL}/rest/v1/works` +
      `?select=*` +
      `&status=eq.pending`;


    const response =
      await fetch(
        url,
        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Accept":
              "application/json"

          }

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        JSON.stringify(data)
      );

    }


    document
      .getElementById("counter")
      .textContent =
      data.length;


    if (!data.length) {

      container.innerHTML =
        `
          <div class="empty">
            AUCUNE ŒUVRE EN ATTENTE
          </div>
        `;

      return;

    }


    container.innerHTML = "";


    for (
      const work of data
    ) {

      container.appendChild(
        await createWorkCard(
          work
        )
      );

    }

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `
        <div class="empty">

          ERREUR DE CHARGEMENT

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>
      `;

  }

}


/* =========================================================
   REVERSE GEOCODING
========================================================= */

async function getAddress(
  latitude,
  longitude
) {

  if (
    latitude === null ||
    longitude === null ||
    latitude === undefined ||
    longitude === undefined
  ) {

    return "LOCALISATION INCONNUE";

  }


  try {

    const response =
      await fetch(

        "https://nominatim.openstreetmap.org/reverse?" +
        new URLSearchParams({

          lat:
            latitude,

          lon:
            longitude,

          format:
            "json",

          zoom:
            "18",

          addressdetails:
            "1"

        }),

        {

          headers: {

            "Accept-Language":
              "fr"

          }

        }

      );


    if (!response.ok) {

      return "ADRESSE INDISPONIBLE";

    }


    const data =
      await response.json();


    return (
      data.display_name ||
      "ADRESSE INDISPONIBLE"
    );

  } catch {

    return "ADRESSE INDISPONIBLE";

  }

}


/* =========================================================
   CREATE CARD
========================================================= */

async function createWorkCard(
  work
) {

  const article =
    document.createElement(
      "article"
    );

  article.className =
    "work";


  /*
    On récupère l'ID avec plusieurs
    possibilités pour être robuste.

    La bonne colonne chez toi est normalement "Id".
  */

  const workId =
    work.Id ??
    work.ID ??
    work.id;


  const latitude =
    Number(
      work.latitude
    );


  const longitude =
    Number(
      work.longitude
    );


  const address =
    await getAddress(
      latitude,
      longitude
    );


  let photo = "";

  if (work.photo_url) {

    photo =
      `
        <img
          class="photo"
          src="${escapeHTML(
            work.photo_url
          )}"
          alt="Œuvre"
        >
      `;

  }


  article.innerHTML =
    `

      ${photo}

      <div class="info">

        <div class="category">

          ${escapeHTML(
            (
              work.category ||
              "WORK"
            ).toUpperCase()
          )}

        </div>


        <div class="date">

          DATE :
          ${escapeHTML(
            work.date ||
            "—"
          )}

        </div>


        <div class="coordinates">

          COORDONNÉES :
          ${Number.isFinite(latitude)
            ? latitude.toFixed(6)
            : "—"
          }
          ,
          ${Number.isFinite(longitude)
            ? longitude.toFixed(6)
            : "—"
          }

        </div>


        <div class="address">

          ADRESSE :

          <br>

          ${escapeHTML(
            address
          )}

        </div>


        <div
          class="admin-map"
          id="map-${workId}"
        ></div>


        <div class="map-help">

          CLIQUEZ SUR LA CARTE POUR MODIFIER
          LA POSITION DE L'ŒUVRE.

        </div>


        <div class="actions">

          <button
            class="approve"
          >
            ✓ APPROUVER
          </button>

          <button
            class="reject"
          >
            ✕ REFUSER
          </button>

        </div>


        <div
          class="status"
        ></div>

      </div>

    `;


  /*
    On initialise la carte
    après que le HTML existe.
  */

  setTimeout(
    () => {

      initializeAdminMap(
        article,
        work,
        workId
      );

    },
    50
  );


  article
    .querySelector(".approve")
    .addEventListener(
      "click",
      () => {

        moderateWork(
          workId,
          "approved",
          article
        );

      }
    );


  article
    .querySelector(".reject")
    .addEventListener(
      "click",
      () => {

        moderateWork(
          workId,
          "rejected",
          article
        );

      }
    );


  return article;

}


/* =========================================================
   ADMIN MAP
========================================================= */

function initializeAdminMap(
  article,
  work,
  workId
) {

  const mapElement =
    article.querySelector(
      `#map-${workId}`
    );


  if (!mapElement) {

    console.error(
      "Conteneur de carte introuvable",
      workId
    );

    return;

  }


  const latitude =
    Number(
      work.latitude
    );


  const longitude =
    Number(
      work.longitude
    );


  if (
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ) {

    mapElement.innerHTML =
      `
        <div
          style="
            padding:20px;
            font-size:10px;
            font-weight:900;
          "
        >
          COORDONNÉES INVALIDES
        </div>
      `;

    return;

  }


  const adminMap =
    L.map(
      mapElement,
      {
        zoomControl:
          true
      }
    ).setView(
      [
        latitude,
        longitude
      ],
      17
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

      attribution:
        "© OpenStreetMap contributors"

    }
  ).addTo(
    adminMap
  );


  const marker =
    L.marker(
      [
        latitude,
        longitude
      ],
      {
        draggable:
          true
      }
    ).addTo(
      adminMap
    );


  /*
    Déplacement du marqueur
  */

  marker.on(
    "dragend",
    async () => {

      const position =
        marker.getLatLng();


      work.latitude =
        position.lat;

      work.longitude =
        position.lng;


      const addressElement =
        article.querySelector(
          ".address"
        );


      addressElement.textContent =
        "ADRESSE : RECHERCHE...";


      const address =
        await getAddress(
          position.lat,
          position.lng
        );


      addressElement.innerHTML =
        `
          ADRESSE :
          <br>
          ${escapeHTML(
            address
          )}
        `;

    }
  );


  /*
    Cliquer directement sur la carte
    déplace également le marqueur.
  */

  adminMap.on(
    "click",
    async event => {

      marker.setLatLng(
        event.latlng
      );


      work.latitude =
        event.latlng.lat;

      work.longitude =
        event.latlng.lng;


      const addressElement =
        article.querySelector(
          ".address"
        );


      addressElement.textContent =
        "ADRESSE : RECHERCHE...";


      const address =
        await getAddress(
          event.latlng.lat,
          event.latlng.lng
        );


      addressElement.innerHTML =
        `
          ADRESSE :
          <br>
          ${escapeHTML(
            address
          )}
        `;

    }
  );


  /*
    Sauvegarde les nouvelles coordonnées
    dans l'objet de la carte.
  */

  work._adminMap =
    adminMap;

}


/* =========================================================
   MODERATION
========================================================= */

async function moderateWork(
  workId,
  status,
  article
) {

  const statusElement =
    article.querySelector(
      ".status"
    );


  if (
    workId === undefined ||
    workId === null ||
    workId === ""
  ) {

    statusElement.textContent =
      "ERREUR : ID MANQUANT";

    return;

  }


  statusElement.textContent =
    "ENREGISTREMENT...";


  try {

    const token =
      getToken();


    if (!token) {

      throw new Error(
        "Session expirée."
      );

    }


    /*
      On récupère l'utilisateur connecté.
    */

    const userResponse =
      await fetch(
        `${SUPABASE_URL}/auth/v1/user`,
        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`

          }

        }
      );


    const user =
      await userResponse.json();


    if (!user.id) {

      throw new Error(
        "Utilisateur non connecté."
      );

    }


    /*
      Récupère les coordonnées éventuellement
      modifiées sur la carte.
    */

    const map =
      article._adminMap;


    /*
      On retrouve le travail dans le DOM
      via les informations affichées.
    */

    const coordinates =
      article
        .querySelector(
          ".coordinates"
        )
        .textContent;


    /*
      On utilise les coordonnées initiales
      si aucune modification n'a été faite.
    */

    const payload = {

      status:
        status,

      reviewed_at:
        new Date().toISOString(),

      reviewed_by:
        user.id

    };


    /*
      IMPORTANT :
      On met à jour "Id", pas "id".
    */

    const url =
      `${SUPABASE_URL}/rest/v1/works` +
      `?Id=eq.${encodeURIComponent(
        workId
      )}`;


    const response =
      await fetch(
        url,
        {

          method:
            "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();


      throw new Error(
        errorText ||
        "Impossible de modifier l'œuvre."
      );

    }


    statusElement.textContent =
      status === "approved"
        ? "✓ ŒUVRE APPROUVÉE"
        : "✓ ŒUVRE REFUSÉE";


    /*
      Petite pause puis recharge.
    */

    setTimeout(
      loadPendingWorks,
      500
    );


  } catch (error) {

    console.error(
      error
    );


    statusElement.textContent =
      "ERREUR : " +
      error.message;

  }

}


/* =========================================================
   LOGOUT
========================================================= */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    () => {

      localStorage.removeItem(
        "valen_access_token"
      );

      localStorage.removeItem(
        "valen_refresh_token"
      );

      location.reload();

    }
  );


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   EXISTING SESSION
========================================================= */

if (
  getToken()
) {

  showAdmin();

}

</script>

</body>
</html>
