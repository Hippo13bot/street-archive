<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;

  color: #111;

body {

button,

button {

/* =========================
   LOGIN
========================= */

#loginScreen {

  min-height: 100vh;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

.login-box {

  width: 100%;
  max-width: 400px;

  padding: 20px;

  border: 2px solid #111;
}

.logo {

  display: inline-block;

  padding: 5px 7px 4px;

  border: 2px solid #111;

  font-size: 22px;

  font-weight: 900;

  letter-spacing: -1.5px;
}

.admin-label {

  margin-top: 5px;

  font-size: 9px;

  letter-spacing: 1.5px;
}

.login-box h1 {

  font-size: 28px;

}

label {

  display: block;

  margin: 13px 0 5px;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

input {

  width: 100%;

  padding: 11px;

  border: 1px solid #111;

  border-radius: 0;

  background: transparent;
}

.login-button {

  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border: 2px solid #111;

  color: #f4f4f0;

  letter-spacing: 1px;
}

.error {

/* =========================
   ADMIN HEADER
========================= */

header {

  padding: 16px;

  border-bottom: 2px solid #111;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;
}

.logout {

  padding: 8px 10px;

  border-radius: 0;

  background: transparent;

  font-size: 9px;

  font-weight: 900;
}


/* =========================
   MAIN
========================= */

main {

  width: 100%;

  max-width: 1100px;

  margin: auto;

  padding: 18px 16px 50px;
}

.top {

  display: flex;

  align-items: end;

  justify-content: space-between;

  gap: 10px;

  margin-bottom: 18px;

h1 {

  margin: 0;

  font-size: 28px;

  line-height: 1;

  letter-spacing: -1.5px;
}

.counter {

  padding: 6px 8px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   WORKS
========================= */

#works {

  display: grid;

  gap: 18px;
}

.work {

  border: 2px solid #111;

  background: #f4f4f0;
}

.photo {

  width: 100%;

  height: 300px;

  object-fit: cover;

  display: block;

  border-bottom: 1px solid #111;
}

.info {

  padding: 14px;
}

.category {

  display: inline-block;

  padding: 5px 7px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

.date {

  margin-top: 9px;

  font-size: 10px;

  font-weight: 700;
}


/* =========================
   LOCATION
========================= */

.location-box {

  margin-top: 12px;

  border: 1px solid #111;
}

.location-title {

  padding: 7px;

  border-bottom: 1px solid #111;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

.address {

  padding: 9px;

  font-size: 10px;

  line-height: 1.4;
}

.coordinates {

  padding: 0 9px 9px;

  font-size: 9px;

  opacity: .7;
}

.admin-map {

  width: 100%;

  height: 230px;

  border-top: 1px solid #111;
}


/* =========================
   MAP BUTTONS
========================= */

.map-actions {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 6px;

  padding: 8px;
}

.map-button {

  padding: 10px;

  border: 1px solid #111;

  background: transparent;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: .7px;
}

.map-button.active {

  background: #111;

  color: #f4f4f0;
}


/* =========================
   ACTIONS
========================= */

.actions {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 7px;

  margin-top: 15px;
}

.approve,
.reject {

  padding: 12px;

  border-radius: 0;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: .8px;
}

.approve {

  border: 2px solid #111;

  background: #111;

  color: #f4f4f0;
}

.reject {

  border: 1px solid #111;

  background: transparent;

  color: #111;
}

.status {

  margin-top: 10px;

  font-size: 10px;

  font-weight: 900;

  line-height: 1.4;
}


/* =========================
   EMPTY
========================= */

.empty {

  padding: 30px 15px;

  border: 1px dashed #111;

  text-align: center;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 1px;
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

  #works {

    grid-template-columns:
      repeat(2, 1fr);
  }

}

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://klvcugwhjaxmpvskplqd.supabase.co";


const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsdmN1Z3doamF4bXB2c2twbHFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODQzNTMsImV4cCI6MjEwMjY2MDM1M30.pEvX_uzDvUMTaZbeCWE071718XGGm0YAj6FgZaB6gVE";


/* =====================================================
   SESSION
===================================================== */

function getToken() {

  return localStorage.getItem(
    "valen_access_token"
  );

}


/* =====================================================
   LOGIN
===================================================== */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const error =
        document
          .getElementById("loginError");


      error.textContent =
        "CONNEXION...";


      try {

        const response =
          await fetch(

            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,

            {

              method: "POST",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  email:
                    email,

                  password:
                    password

                })

            }

          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(

            data.error_description ||
            data.msg ||
            "Connexion impossible."

          );

        }


        localStorage.setItem(

          "valen_access_token",

          data.access_token

        );


        localStorage.setItem(

          "valen_refresh_token",

          data.refresh_token

        );


        showAdmin();


      }

      catch(error) {

        console.error(error);

        errorElement(
          error.message
        );

      }

    }

  );


function errorElement(message) {

  document
    .getElementById("loginError")
    .textContent =
    message;

}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin() {

  document
    .getElementById("loginScreen")
    .style.display =
    "none";


  document
    .getElementById("adminApp")
    .style.display =
    "block";


  loadPendingWorks();

}


/* =====================================================
   LOAD PENDING WORKS
===================================================== */

async function loadPendingWorks() {

  const container =
    document.getElementById(
      "works"
    );


  container.innerHTML = `

    <div class="empty">
      CHARGEMENT...
    </div>

  `;


  try {

    const token =
      getToken();


    if (!token) {

      throw new Error(
        "SESSION ABSENTE."
      );

    }


    /*
      IMPORTANT :

      La colonne est bien :

      id

      et PAS :

      Id

      On utilise également
      status=eq.pending.
    */

    const url =

      `${SUPABASE_URL}/rest/v1/works` +

      `?select=*` +

      `&status=eq.pending` +

      `&order=id.desc`;


    const response =
      await fetch(

        url,

        {

          method:
            "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Accept":
              "application/json"

          }

        }

      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch {

      throw new Error(
        text ||
        "Réponse Supabase invalide."
      );

    }


    if (!response.ok) {

      throw new Error(
        JSON.stringify(data)
      );

    }


    if (!Array.isArray(data)) {

      throw new Error(
        "Supabase n'a pas renvoyé une liste d'œuvres."
      );

    }


    document
      .getElementById("counter")
      .textContent =
      data.length;


    if (data.length === 0) {

      container.innerHTML = `

        <div class="empty">

          AUCUNE ŒUVRE EN ATTENTE

        </div>

      `;

      return;

    }


    container.innerHTML = "";


    data.forEach(
      function(work) {

        container.appendChild(

          createWorkCard(
            work
          )

        );

      }

    );

  }

  catch(error) {

    console.error(error);


    container.innerHTML = `

      <div class="empty">

        ERREUR DE CHARGEMENT

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   WORK CARD
===================================================== */

function createWorkCard(work) {

  const article =
    document.createElement(
      "article"
    );


  article.className =
    "work";


  /*
    TRÈS IMPORTANT :

    On récupère l'ID directement
    depuis work.id.

    Aucun "Id".
    Aucun "id" global.
    Aucun undefined.
  */

  const workId =
    work.id;


  const latitude =
    Number(
      work.latitude
    );


  const longitude =
    Number(
      work.longitude
    );


  const validCoordinates =

    Number.isFinite(latitude) &&
    Number.isFinite(longitude);


  article.innerHTML = `

    ${
      work.photo_url

      ?

      `

        <img

          class="photo"

          src="${escapeHTML(
            work.photo_url
          )}"

          alt="Œuvre"

        >

      `

      :

      ""

    }


    <div class="info">


      <div class="category">

        ${escapeHTML(

          String(
            work.category ||
            "WORK"
          ).toUpperCase()

        )}

      </div>


      <div class="date">

        DATE :

        ${escapeHTML(
          work.date ||
          "—"
        )}

      </div>


      <div class="location-box">


        <div class="location-title">

          LOCALISATION

        </div>


        <div
          class="address"
          id="address-${workId}"
        >

          RECHERCHE DE L'ADRESSE...

        </div>


        <div
          class="coordinates"
          id="coordinates-${workId}"
        >

          ${
            validCoordinates

              ?

              `${latitude.toFixed(6)},
               ${longitude.toFixed(6)}`

              :

              "COORDONNÉES ABSENTES"

          }

        </div>


        <div
          class="admin-map"
          id="map-${workId}"
        ></div>


        <div class="map-actions">

          <button
            type="button"
            class="map-button"
            data-action="address"
          >
            ADRESSE
          </button>


          <button
            type="button"
            class="map-button"
            data-action="gps"
          >
            MA POSITION
          </button>

        </div>


      </div>


      <div class="actions">


        <button
          type="button"
          class="approve"
        >

          ✓ APPROUVER

        </button>


        <button
          type="button"
          class="reject"
        >

          ✕ REFUSER

        </button>


      </div>


      <div
        class="status"
        id="status-${workId}"
      ></div>


    </div>

  `;


  /*
    MAP
  */

  if (validCoordinates) {

    setTimeout(
      function() {

        createAdminMap(

          workId,

          latitude,

          longitude

        );

      },

      50

    );

    reverseGeocode(

      workId,

      latitude,

      longitude

    );

  }

  else {

    document
      .getElementById(
        `address-${workId}`
      )
      .textContent =
      "LOCALISATION NON RENSEIGNÉE";

  }


  /*
    APPROVE
  */

  article
    .querySelector(".approve")
    .addEventListener(
      "click",
      function() {

        moderateWork(

          workId,

          "approved"

        );

      }

    );


  /*
    REJECT
  */

  article
    .querySelector(".reject")
    .addEventListener(
      "click",
      function() {

        moderateWork(

          workId,

          "rejected"

        );

      }

    );


  /*
    GPS
  */

  article
    .querySelector(
      '[data-action="gps"]'
    )
    .addEventListener(
      "click",
      function() {

        moveWorkToGPS(
          workId
        );

      }

    );


  /*
    ADDRESS
  */

  article
    .querySelector(
      '[data-action="address"]'
    )
    .addEventListener(
      "click",
      function() {

        moveWorkToAddress(
          workId
        );

      }

    );


  return article;

}


/* =====================================================
   ADMIN MAPS
===================================================== */

const adminMaps = {};


const adminMarkers = {};


function createAdminMap(

  workId,

  latitude,

  longitude

) {

  const element =
    document.getElementById(
      `map-${workId}`
    );


  if (!element) {

    return;

  }


  if (adminMaps[workId]) {

    return;

  }


  const map =
    L.map(
      element,
      {

        zoomControl:
          true

      }

    ).setView(

      [
        latitude,
        longitude
      ],

      16

    );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      attribution:
        "© OpenStreetMap contributors"

    }

  ).addTo(map);


  const marker =
    L.marker(

      [
        latitude,
        longitude

      ]

    ).addTo(map);


  adminMaps[workId] =
    map;


  adminMarkers[workId] =
    marker;


  /*
    Cliquer sur la carte
    déplace l'œuvre.
  */

  map.on(
    "click",
    function(event) {

      updateWorkLocation(

        workId,

        event.latlng.lat,

        event.latlng.lng

      );

    }

  );


  setTimeout(
    function() {

      map.invalidateSize();

    },

    100

  );

}


/* =====================================================
   UPDATE LOCATION
===================================================== */

async function updateWorkLocation(

  workId,

  latitude,

  longitude

) {

  const status =
    document.getElementById(
      `status-${workId}`
    );


  status.textContent =
    "ENREGISTREMENT DE LA POSITION...";


  try {

    const token =
      getToken();


    if (!workId) {

      throw new Error(
        "ID DE L'ŒUVRE ABSENT."
      );

    }


    const response =
      await fetch(

        `${SUPABASE_URL}/rest/v1/works?id=eq.${encodeURIComponent(
          workId
        )}`,

        {

          method:
            "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              latitude:
                latitude,

              longitude:
                longitude

            })

        }

      );


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(
        error
      );

    }


    /*
      Mise à jour de la carte.
    */

    if (
      adminMarkers[workId]
    ) {

      adminMarkers[workId]
        .setLatLng(

          [
            latitude,
            longitude

          ]

        );

    }


    document
      .getElementById(
        `coordinates-${workId}`
      )
      .textContent =

      `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;


    reverseGeocode(

      workId,

      latitude,

      longitude

    );


    status.textContent =
      "✓ POSITION MODIFIÉE";

  }

  catch(error) {

    console.error(error);

    status.textContent =
      "ERREUR : " +
      error.message;

  }

}


/* =====================================================
   GPS ADMIN
===================================================== */

function moveWorkToGPS(
  workId
) {

  if (
    !navigator.geolocation
  ) {

    alert(
      "La géolocalisation n'est pas disponible."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      updateWorkLocation(

        workId,

        position.coords.latitude,

        position.coords.longitude

      );


      if (
        adminMaps[workId]
      ) {

        adminMaps[workId].setView(

          [
            position.coords.latitude,
            position.coords.longitude

          ],

          17

        );

      }

    },

    function() {

      alert(
        "Impossible d'obtenir votre position."
      );

    }

  );

}


/* =====================================================
   ADDRESS ADMIN
===================================================== */

async function moveWorkToAddress(
  workId
) {

  const address =
    prompt(
      "Entre la nouvelle adresse :"
    );


  if (!address) {

    return;

  }


  try {

    const response =
      await fetch(

        "https://nominatim.openstreetmap.org/search?" +

        new URLSearchParams({

          q:
            address,

          format:
            "json",

          limit:
            "1",

          addressdetails:
            "1"

        }),

        {

          headers: {

            "Accept-Language":
              "fr"

          }

        }

      );


    const results =
      await response.json();


    if (
      !results.length
    ) {

      throw new Error(
        "Adresse introuvable."
      );

    }


    const result =
      results[0];


    const latitude =
      Number(
        result.lat
      );


    const longitude =
      Number(
        result.lon
      );


    await updateWorkLocation(

      workId,

      latitude,

      longitude

    );


    if (
      adminMaps[workId]
    ) {

      adminMaps[workId].setView(

        [
          latitude,
          longitude

        ],

        17

      );

    }

  }

  catch(error) {

    alert(
      error.message
    );

  }

}


/* =====================================================
   REVERSE GEOCODING
===================================================== */

async function reverseGeocode(

  workId,

  latitude,

  longitude

) {

  const addressElement =
    document.getElementById(
      `address-${workId}`
    );


  if (!addressElement) {

    return;

  }


  try {

    const response =
      await fetch(

        "https://nominatim.openstreetmap.org/reverse?" +

        new URLSearchParams({

          lat:
            latitude,

          lon:
            longitude,

          format:
            "json",

          addressdetails:
            "1"

        }),

        {

          headers: {

            "Accept-Language":
              "fr"

          }

        }

      );


    const result =
      await response.json();


    if (
      result.display_name
    ) {

      addressElement.textContent =
        result.display_name;

    }

    else {

      addressElement.textContent =
        "ADRESSE INCONNUE";

    }

  }

  catch(error) {

    addressElement.textContent =
      "ADRESSE NON DISPONIBLE";

  }

}


/* =====================================================
   MODERATION
===================================================== */

async function moderateWork(

  workId,

  newStatus

) {

  const statusElement =
    document.getElementById(
      `status-${workId}`
    );


  statusElement.textContent =
    "ENREGISTREMENT...";


  try {

    /*
      Sécurité importante :
      on vérifie que l'ID existe.
    */

    if (
      workId === undefined ||
      workId === null ||
      workId === ""
    ) {

      throw new Error(
        "ID DE L'ŒUVRE ABSENT."
      );

    }


    const token =
      getToken();


    if (!token) {

      throw new Error(
        "SESSION EXPIRÉE."
      );

    }


    /*
      Récupération de l'utilisateur.
    */

    const userResponse =
      await fetch(

        `${SUPABASE_URL}/auth/v1/user`,

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`

          }

        }

      );


    const user =
      await userResponse.json();


    if (!user.id) {

      throw new Error(
        "UTILISATEUR NON CONNECTÉ."
      );

    }


    /*
      PATCH AVEC id EN MINUSCULE.
    */

    const endpoint =

      `${SUPABASE_URL}/rest/v1/works` +

      `?id=eq.${encodeURIComponent(
        String(workId)
      )}`;


    const response =
      await fetch(

        endpoint,

        {

          method:
            "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              status:
                newStatus,

              reviewed_at:
                new Date().toISOString(),

              reviewed_by:
                user.id

            })

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        text ||
        "Impossible de modifier l'œuvre."
      );

    }


    statusElement.textContent =

      newStatus === "approved"

        ?

        "✓ ŒUVRE APPROUVÉE"

        :

        "✓ ŒUVRE REFUSÉE";


    /*
      On recharge après un court délai
      pour laisser voir le message.
    */

    setTimeout(

      function() {

        loadPendingWorks();

      },

      500

    );

  }

  catch(error) {

    console.error(error);


    statusElement.textContent =

      "ERREUR : " +
      error.message;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

document
  .getElementById("logout")
  .addEventListener(

    "click",

    function() {

      localStorage.removeItem(
        "valen_access_token"
      );

      localStorage.removeItem(
        "valen_refresh_token"
      );

      location.reload();

    }

  );


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   EXISTING SESSION
===================================================== */

if (
  getToken()
) {

  showAdmin();

}

</script>
