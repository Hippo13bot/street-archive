<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>VALEN WORLD — ADMIN</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: #f4f4f0;
  color: #111;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}


/* LOGIN */

#loginScreen {

  min-height: 100vh;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;

}

.login-box {

  width: 100%;
  max-width: 400px;

  padding: 20px;

  border: 2px solid #111;

}

.logo {

  display: inline-block;

  padding: 5px 7px 4px;

  border: 2px solid #111;

  font-size: 22px;

  font-weight: 900;

  letter-spacing: -1.5px;

}

.login-box h1 {

  margin-top: 25px;

  font-size: 28px;

}

label {

  display: block;

  margin:
    14px 0 5px;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;

}

input,
select {

  width: 100%;

  padding: 11px;

  border: 1px solid #111;

  border-radius: 0;

  background: transparent;

}

.login-button {

  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border: 2px solid #111;

  background: #111;

  color: #f4f4f0;

  font-size: 10px;

  font-weight: 900;

}

.error {

  margin-top: 10px;

  font-size: 10px;

  font-weight: 900;

}


/* ADMIN */

#adminApp {
  display: none;
}

header {

  padding: 15px;

  border-bottom: 2px solid #111;

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.logout {

  padding: 9px;

  border: 1px solid #111;

  background: transparent;

  font-size: 9px;

  font-weight: 900;

}

main {

  max-width: 1200px;

  margin: auto;

  padding: 18px 15px 50px;

}

.top {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 15px;

}

h1 {

  margin: 0;

  font-size: 28px;

  letter-spacing: -1.5px;

}

.counter {

  padding: 6px 8px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 900;

}


/* WORKS */

#works {

  display: grid;

  gap: 15px;

}

.work {

  border: 2px solid #111;

}

.photo {

  width: 100%;

  max-height: 450px;

  object-fit: cover;

  display: block;

  border-bottom: 1px solid #111;

}

.info {

  padding: 13px;

}

.category {

  display: inline-block;

  padding: 5px 7px;

  border: 1px dashed #111;

  font-size: 9px;

  font-weight: 900;

}

.meta {

  margin-top: 8px;

  font-size: 10px;

  font-weight: 700;

}

.address {

  margin-top: 8px;

  padding: 8px;

  border: 1px dashed #111;

  font-size: 10px;

  line-height: 1.4;

}

.coordinates {

  margin-top: 6px;

  font-size: 9px;

  opacity: .7;

}


/* MAP */

.admin-map {

  width: 100%;

  height: 280px;

  margin-top: 12px;

  border: 1px solid #111;

}

.map-help {

  margin-top: 5px;

  font-size: 8px;

  font-weight: 900;

  letter-spacing: .5px;

}


/* ACTIONS */

.actions {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-top: 13px;

}

.actions button {

  padding: 12px;

  border: 1px solid #111;

  font-size: 9px;

  font-weight: 900;

}

.approve {

  background: #111;

  color: #f4f4f0;

}

.reject {

  background: transparent;

}

.save {

  grid-column: 1 / -1;

  background: transparent;

}


/* EMPTY */

.empty {

  padding: 30px 15px;

  border: 1px dashed #111;

  text-align: center;

  font-size: 10px;

  font-weight: 900;

}

.status {

  margin-top: 9px;

  font-size: 10px;

  font-weight: 900;

}


@media (min-width: 700px) {

  #works {

    grid-template-columns:
      repeat(2, 1fr);

  }

}

</style>

</head>

<body>


<!-- LOGIN -->

<section id="loginScreen">

  <div class="login-box">

    <div class="logo">
      VALEN WORLD
    </div>

    <h1>
      ADMIN
    </h1>

    <form id="loginForm">

      <label>
        EMAIL
      </label>

      <input
        id="email"
        type="email"
        required
      >

      <label>
        MOT DE PASSE
      </label>

      <input
        id="password"
        type="password"
        required
      >

      <button
        class="login-button"
        type="submit"
      >
        SE CONNECTER
      </button>

      <div
        class="error"
        id="loginError"
      ></div>

    </form>

  </div>

</section>


<!-- ADMIN -->

<div id="adminApp">

  <header>

    <div>

      <div class="logo">
        VALEN WORLD
      </div>

      <div
        style="
          margin-top:5px;
          font-size:9px;
          font-weight:900;
          letter-spacing:1px;
        "
      >
        ADMINISTRATION
      </div>

    </div>

    <button
      class="logout"
      id="logout"
    >
      DÉCONNEXION
    </button>

  </header>


  <main>

    <div class="top">

      <h1>
        À VALIDER
      </h1>

      <div class="counter">
        <span id="counter">0</span>
        EN ATTENTE
      </div>

    </div>

    <div id="works"></div>

  </main>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://klvcugwhjaxmpvskplqd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AAzooie5TH6HNzupodCrvQ_nWrY0D_t";


/* =====================================================
   AUTH
===================================================== */

function getToken() {

  return localStorage.getItem(
    "valen_access_token"
  );

}


async function supabaseFetch(
  path,
  options = {}
) {

  const token =
    getToken();


  return fetch(
    `${SUPABASE_URL}${path}`,
    {

      ...options,

      headers: {

        "apikey":
          SUPABASE_KEY,

        ...(token
          ? {
              "Authorization":
                `Bearer ${token}`
            }
          : {}),

        ...(options.headers || {})

      }

    }
  );

}


/* =====================================================
   LOGIN
===================================================== */

document.getElementById(
  "loginForm"
).addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const error =
      document.getElementById(
        "loginError"
      );


    error.textContent =
      "CONNEXION...";


    try {

      const response =
        await fetch(
          `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
          {

            method: "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                email:
                  document.getElementById(
                    "email"
                  ).value.trim(),

                password:
                  document.getElementById(
                    "password"
                  ).value

              })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          "Connexion impossible."
        );

      }


      localStorage.setItem(
        "valen_access_token",
        data.access_token
      );


      localStorage.setItem(
        "valen_refresh_token",
        data.refresh_token
      );


      showAdmin();


    } catch (err) {

      error.textContent =
        err.message;

    }

  }
);


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin() {

  document.getElementById(
    "loginScreen"
  ).style.display =
    "none";


  document.getElementById(
    "adminApp"
  ).style.display =
    "block";


  loadPendingWorks();

}


/* =====================================================
   LOAD PENDING
===================================================== */

async function loadPendingWorks() {

  const container =
    document.getElementById(
      "works"
    );


  container.innerHTML =
    `<div class="empty">
      CHARGEMENT...
    </div>`;


  try {

    /*
      IMPORTANT :
      "Id" est volontairement écrit
      avec une majuscule.
    */

    const response =
      await supabaseFetch(
        `/rest/v1/works?select=*&status=eq.pending&order=created_at.asc`
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        JSON.stringify(data)
      );

    }


    document.getElementById(
      "counter"
    ).textContent =
      data.length;


    if (!data.length) {

      container.innerHTML =
        `<div class="empty">
          AUCUNE ŒUVRE EN ATTENTE
        </div>`;

      return;

    }


    container.innerHTML = "";


    for (
      const work of data
    ) {

      container.appendChild(
        await createWorkCard(work)
      );

    }


  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        ERREUR : ${escapeHTML(error.message)}
      </div>`;

  }

}


/* =====================================================
   CARD
===================================================== */

async function createWorkCard(work) {

  const article =
    document.createElement(
      "article"
    );


  article.className =
    "work";


  const latitude =
    Number(work.latitude);

  const longitude =
    Number(work.longitude);


  const mapId =
    `map-${work.Id}`;


  const addressId =
    `address-${work.Id}`;


  article.innerHTML = `

    ${
      work.photo_url
        ? `
          <img
            class="photo"
            src="${escapeHTML(work.photo_url)}"
            alt="Œuvre"
          >
        `
        : ""
    }

    <div class="info">

      <div class="category">
        ${escapeHTML(
          (work.category || "").toUpperCase()
        )}
      </div>

      <div class="meta">
        DATE :
        ${escapeHTML(
          work.date || "—"
        )}
      </div>

      <div
        class="address"
        id="${addressId}"
      >
        RECHERCHE DE L'ADRESSE...
      </div>

      <div class="coordinates">
        ${latitude.toFixed(6)},
        ${longitude.toFixed(6)}
      </div>

      <div
        class="admin-map"
        id="${mapId}"
      ></div>

      <div class="map-help">
        DÉPLACE LE POINT SUR LA CARTE POUR MODIFIER LA LOCALISATION.
      </div>

      <div class="actions">

        <button
          class="approve"
          data-id="${work.Id}"
        >
          ✓ APPROUVER
        </button>

        <button
          class="reject"
          data-id="${work.Id}"
        >
          ✕ REFUSER
        </button>

        <button
          class="save"
          data-id="${work.Id}"
        >
          ENREGISTRER LA NOUVELLE POSITION
        </button>

      </div>

      <div
        class="status"
        id="status-${work.Id}"
      ></div>

    </div>
  `;


  /* =================================================
     ADMIN MAP
  ================================================= */

  const adminMap =
    L.map(
      mapId,
      {
        zoomControl: false
      }
    ).setView(
      [
        latitude,
        longitude
      ],
      16
    );


  L.control.zoom({
    position: "bottomright"
  }).addTo(
    adminMap
  );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(
    adminMap
  );


  const marker =
    L.marker(
      [
        latitude,
        longitude
      ],
      {
        draggable: true
      }
    ).addTo(
      adminMap
    );


  work._adminLatitude =
    latitude;

  work._adminLongitude =
    longitude;


  marker.on(
    "dragend",
    event => {

      const position =
        event.target.getLatLng();


      work._adminLatitude =
        position.lat;

      work._adminLongitude =
        position.lng;


      article.querySelector(
        ".coordinates"
      ).textContent =
        `${position.lat.toFixed(6)}, ${position.lng.toFixed(6)}`;


      reverseGeocode(
        position.lat,
        position.lng,
        addressId
      );

    }
  );


  /* Adresse initiale */

  reverseGeocode(
    latitude,
    longitude,
    addressId
  );


  /* APPROUVER */

  article
    .querySelector(".approve")
    .addEventListener(
      "click",
      () =>
        moderateWork(
          work,
          "approved"
        )
    );


  /* REFUSER */

  article
    .querySelector(".reject")
    .addEventListener(
      "click",
      () =>
        moderateWork(
          work,
          "rejected"
        )
    );


  /* SAUVEGARDER POSITION */

  article
    .querySelector(".save")
    .addEventListener(
      "click",
      () =>
        savePosition(work)
    );


  return article;

}


/* =====================================================
   REVERSE GEOCODING
===================================================== */

async function reverseGeocode(
  latitude,
  longitude,
  elementId
) {

  try {

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/reverse?" +
        new URLSearchParams({

          lat:
            latitude,

          lon:
            longitude,

          format:
            "json",

          zoom:
            "18",

          addressdetails:
            "1"

        }),
        {
          headers: {
            "Accept-Language":
              "fr"
          }
        }
      );


    const data =
      await response.json();


    document.getElementById(
      elementId
    ).textContent =
      data.display_name ||
      "Adresse introuvable.";


  } catch (error) {

    document.getElementById(
      elementId
    ).textContent =
      "Adresse indisponible.";

  }

}


/* =====================================================
   SAVE POSITION
===================================================== */

async function savePosition(work) {

  const status =
    document.getElementById(
      `status-${work.Id}`
    );


  status.textContent =
    "ENREGISTREMENT...";


  try {

    const response =
      await supabaseFetch(
        `/rest/v1/works?Id=eq.${encodeURIComponent(work.Id)}`,
        {

          method:
            "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              latitude:
                work._adminLatitude,

              longitude:
                work._adminLongitude

            })

        }
      );


    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(text);

    }


    status.textContent =
      "✓ POSITION ENREGISTRÉE";


  } catch (error) {

    console.error(error);

    status.textContent =
      "ERREUR : " +
      error.message;

  }

}


/* =====================================================
   MODERATION
===================================================== */

async function moderateWork(
  work,
  newStatus
) {

  const status =
    document.getElementById(
      `status-${work.Id}`
    );


  status.textContent =
    "ENREGISTREMENT...";


  try {

    /*
      Récupération du compte connecté.
    */

    const userResponse =
      await supabaseFetch(
        "/auth/v1/user"
      );


    const user =
      await userResponse.json();


    if (!user.id) {

      throw new Error(
        "Session expirée."
      );

    }


    /*
      IMPORTANT :
      Id avec majuscule.
    */

    const response =
      await supabaseFetch(
        `/rest/v1/works?Id=eq.${encodeURIComponent(work.Id)}`,
        {

          method:
            "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              status:
                newStatus,

              latitude:
                work._adminLatitude,

              longitude:
                work._adminLongitude,

              reviewed_at:
                new Date().toISOString(),

              reviewed_by:
                user.id

            })

        }
      );


    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(text);

    }


    await loadPendingWorks();


  } catch (error) {

    console.error(error);

    status.textContent =
      "ERREUR : " +
      error.message;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

document.getElementById(
  "logout"
).addEventListener(
  "click",
  () => {

    localStorage.removeItem(
      "valen_access_token"
    );

    localStorage.removeItem(
      "valen_refresh_token"
    );

    location.reload();

  }
);


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   SESSION EXISTANTE
===================================================== */

if (getToken()) {

  showAdmin();

}

</script>

</body>
</html>
